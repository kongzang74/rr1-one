<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* 防止出现滚动条 */
        }
        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1; /* 将视频置于页面最底层 */
            object-fit: cover; /* 保证视频铺满整个屏幕 */
        }
        .content {
            position: relative;
            z-index: 1;
            color: white;
            text-align: center;
            padding-top: 20%;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <!-- 
      muted: 必须静音，否则浏览器会阻止自动播放
      autoplay: 自动播放
      loop: 循环播放
      playsinline: 在移动端禁止全屏播放 
    -->
    <video autoplay muted loop playsinline id="bg-video">
        <source src="a.mp4" type="video/mp4">
        您的浏览器不支持 HTML5 视频。
    </video>

    <div class="content">
       
    </div>
</body>
</html>
