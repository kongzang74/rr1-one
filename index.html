<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
<title></title>
<style>
* { padding: 0; margin: 0; box-sizing: border-box; }
body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
body {
  display: flex; justify-content: center; align-items: center;
  background: linear-gradient(-225deg, #0c0c3d 0%, #1a1a5e 30%, #2d1b69 100%);
}
canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

/* ============ Rotating Cards - 左上角小型导航 ============ */
.rotating-nav {
  position: fixed; top: 30px; left: 30px; width: 260px; height: 260px;
  z-index: 200; cursor: default; transition: opacity 0.3s ease;
}
.gallery-overlay.active ~ .rotating-nav,
.video-overlay.active ~ .rotating-nav {
  opacity: 0; pointer-events: none;
}

.rotating-nav .void { width: 100%; height: 100%; position: relative; }
.rotating-nav .crop {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 6;
  -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,1) 55%, rgba(0,0,0,1) 100%);
  mask-image: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,1) 55%, rgba(0,0,0,1) 100%);
}
.rotating-nav ul.card-list {
  --rotate-speed: 30; --count: 6;
  --easing: cubic-bezier(0.000, 0.37, 1.000, 0.63);
  list-style-type: none; margin: 0; padding: 0;
  position: relative; width: 100%; height: 100%; z-index: 1;
}
.rotating-nav ul.card-list:hover * { animation-play-state: paused; }
.rotating-nav li {
  position: absolute; top: 50%; left: 50%;
  transform-origin: center center; width: 100%;
  animation: rotateCW calc(var(--rotate-speed) * 1s) var(--easing) infinite;
}
.rotating-nav .card {
  position: absolute; left: 5%; top: 50%;
  transform: translateY(-50%); width: 22%;
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 10px; gap: 4px;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px) saturate(1.5);
  -webkit-backdrop-filter: blur(10px) saturate(1.5);
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
  border-radius: 10px;
  font: 400 10px 'Arial', sans-serif;
  color: #535062;
  animation: rotateCCW calc(var(--rotate-speed) * 1s) var(--easing) infinite;
  cursor: pointer;
  transition: box-shadow 0.2s, transform 0.2s, background 0.2s;
  -webkit-tap-highlight-color: transparent;
  outline: 0;
}
.rotating-nav .card:hover {
  background: rgba(255, 255, 255, 0.25);
  box-shadow: 0px 6px 18px rgba(0, 0, 0, 0.25);
  transform: translateY(-50%) scale(1.08);
}
.rotating-nav .card img { width: 100%; border-radius: 6px; aspect-ratio: 1 / 1; object-fit: cover; }
.rotating-nav .card span {
  font-weight: 500; font-size: 11px; line-height: 150%;
  color: #fff; display: block; text-align: center;
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
}
.rotating-nav li:nth-child(2), .rotating-nav li:nth-child(2) .card { animation-delay: calc((var(--rotate-speed) / var(--count)) * -1s); }
.rotating-nav li:nth-child(3), .rotating-nav li:nth-child(3) .card { animation-delay: calc((var(--rotate-speed) / var(--count)) * -2s); }
.rotating-nav li:nth-child(4), .rotating-nav li:nth-child(4) .card { animation-delay: calc((var(--rotate-speed) / var(--count)) * -3s); }
.rotating-nav li:nth-child(5), .rotating-nav li:nth-child(5) .card { animation-delay: calc((var(--rotate-speed) / var(--count)) * -4s); }
.rotating-nav li:nth-child(6), .rotating-nav li:nth-child(6) .card { animation-delay: calc((var(--rotate-speed) / var(--count)) * -5s); }

@keyframes rotateCW { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
@keyframes rotateCCW { from { transform: translateY(-50%) rotate(0deg); } to { transform: translateY(-50%) rotate(-360deg); } }

.rotating-nav .center-circle {
  position: absolute; width: 60px; height: 60px;
  left: 50%; top: 50%; transform: translate(-50%, -50%);
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px) saturate(1.5);
  -webkit-backdrop-filter: blur(10px) saturate(1.5);
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
  border-radius: 50%; z-index: 10;
}
.rotating-nav .second-circle {
  position: absolute; width: 40%; height: 40%;
  left: 50%; top: 50%; transform: translate(-50%, -50%);
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(6px) saturate(1.2);
  -webkit-backdrop-filter: blur(6px) saturate(1.2);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 50%;
  box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.15);
  background-image: url(hh/1.gif); background-size: cover; background-position: center; z-index: 5;
}
.rotating-nav .last-circle {
  position: absolute; width: 66%; height: 66%;
  left: 50%; top: 50%; transform: translate(-50%, -50%);
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(4px) saturate(1.1);
  -webkit-backdrop-filter: blur(4px) saturate(1.1);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 50%;
  box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.1);
  background-image: url(hh/1.gif); background-size: cover; background-position: center; z-index: 3;
}
.rotating-nav .mask-ring {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 8; pointer-events: none; background: transparent;
}


/* 中心点击遮罩 - 防止点击中间区域误触发音乐 */
.center-click-blocker {
  position: absolute;
  width: 160px;
  height: 160px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  background: transparent;
  z-index: 11;
  pointer-events: auto;
  border-radius: 50%;
}
/* ============ 星空主页基础样式 ============ */
#splash-screen {
  position: fixed; inset: 0;
  background: linear-gradient(-45deg, #fbc2eb, #a6c1ee, #c2e9fb, #e0c3fc, #f6d365);
  background-size: 400% 400%;
  animation: rainbowFlow 3s ease infinite;
  z-index: 9999; display: flex; justify-content: center; align-items: center;
  transition: opacity 0.8s ease-out;
}
#splash-screen h1 {
  font-size: 72px; font-weight: bold; margin: 0; padding: 0 20px; text-align: center; line-height: 1.2;
  background: linear-gradient(-45deg, #fff, #fbc2eb, #fff);
  background-size: 400% 400%; -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  animation: rainbowFlow 3s ease infinite;
  text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
}
#splash-hint {
  position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
  color: rgba(255, 255, 255, 0.8); font-size: 14px; letter-spacing: 2px;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
@keyframes rainbowFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

/* 内容面板 - 毛玻璃 */
.content {
  position: relative; z-index: 1; color: white; text-align: center;
  width: 80%; max-width: 400px; padding: 100px 40px 50px; margin-right: 100px;
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(20px) saturate(1.5);
  -webkit-backdrop-filter: blur(20px) saturate(1.5);
  border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
  opacity: 0; transform: translateX(50px); pointer-events: none;
  transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.content.active { opacity: 1; transform: translateX(0); pointer-events: auto; }

/* 侧边触发按钮 - 毛玻璃 */
.sidebar-trigger {
  position: fixed; top: 50%; right: 0; transform: translateY(-50%); z-index: 101;
  padding: 15px 10px;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(15px) saturate(1.5);
  -webkit-backdrop-filter: blur(15px) saturate(1.5);
  border-radius: 12px 0 0 12px; border: 1px solid rgba(255, 255, 255, 0.15); border-right: none;
  color: white; cursor: pointer; writing-mode: vertical-rl; font-size: 14px; letter-spacing: 4px;
  box-shadow: -4px 0 15px rgba(0, 0, 0, 0.15); transition: all 0.3s ease; user-select: none;
}
.sidebar-trigger:hover { background: rgba(255, 255, 255, 0.2); padding-right: 15px; }

/* ============ 照片栏 ============ */
.gallery-overlay {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0, 0, 0, 0.85); z-index: 103;
  overflow-y: auto; display: flex; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
}
.gallery-overlay.active { opacity: 1; pointer-events: auto; }
.gallery-grid { display: flex; gap: 20px; width: 90%; max-width: 1600px; padding: 60px 0; }
.g-col { flex: 1; display: flex; flex-direction: column; gap: 20px; will-change: transform; }
.g-col img {
  width: 100%; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  object-fit: cover; aspect-ratio: 3/4; background-color: #333;
  transition: transform 0.4s ease, box-shadow 0.4s ease; cursor: pointer;
}
.g-col img:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(255,255,255,0.2); z-index: 10; position: relative; }
.g-col:nth-child(1) { margin-top: -100px; }
.g-col:nth-child(2) { margin-top: 50px; }
.g-col:nth-child(3) { margin-top: 0px; }
.g-col:nth-child(4) { margin-top: 50px; }
.g-col:nth-child(5) { margin-top: -100px; }

/* ============ 视频栏 ============ */
.video-overlay {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0, 0, 0, 0.85); z-index: 103;
  overflow-y: auto; display: flex; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
}
.video-overlay.active { opacity: 1; pointer-events: auto; }
.video-grid { display: flex; gap: 20px; width: 90%; max-width: 1600px; padding: 60px 0; }
.v-col { flex: 1; display: flex; flex-direction: column; gap: 20px; will-change: transform; }
.v-col video {
  width: 100%; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  object-fit: cover; aspect-ratio: 3/4; background-color: #333;
  transition: transform 0.4s ease, box-shadow 0.4s ease; cursor: pointer;
}
.v-col video:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(255,255,255,0.2); z-index: 10; position: relative; }
.v-col:nth-child(1) { margin-top: -100px; }
.v-col:nth-child(2) { margin-top: 50px; }
.v-col:nth-child(3) { margin-top: 0px; }
.v-col:nth-child(4) { margin-top: 50px; }
.v-col:nth-child(5) { margin-top: -100px; }

/* ============ 音乐播放器浮层 ============ */
.music-player-float {
  position: fixed; top: 50%; left: 50%;
  width: 380px; max-width: calc(100vw - 40px);
  height: 85vh; max-height: 700px;
  border-radius: 44px; overflow: hidden;
  box-shadow: 0 45px 70px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.18);
  z-index: 105;
  opacity: 0; pointer-events: none;
  transform: translate(-50%, -50%) scale(0.95);
  transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.music-player-float.active {
  opacity: 1; pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}
.music-player-float .player-wrapper {
  position: relative; width: 100%; height: 100%;
  border-radius: 44px; overflow: hidden;
}
.music-player-float .background-image {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  object-fit: cover; background: #1e1e2f;
  filter: brightness(0.85) saturate(1.2);
  z-index: 0; pointer-events: none; user-select: none;
}
.music-player-float .glass-card {
  position: relative; z-index: 2; width: 100%; height: 100%;
  backdrop-filter: blur(30px) saturate(190%);
  -webkit-backdrop-filter: blur(30px) saturate(190%);
  background: rgba(18, 18, 28, 0.4);
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.05) 100%);
  box-shadow: inset 0 0 35px rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.32);
  border-radius: 44px;
  display: flex; flex-direction: column;
  padding: 22px 20px 20px; color: white;
  text-shadow: 0 2px 6px rgba(0,0,0,0.5);
}
.music-player-float .time-display {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px; padding: 0 4px;
}
.music-player-float .current-time {
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  padding: 10px 18px; border-radius: 40px;
  font-weight: 600; font-size: 1.2rem;
  border: 1px solid rgba(255,255,255,0.3); letter-spacing: 0.5px;
}
.music-player-float .date-badge {
  background: rgba(0,0,0,0.2);
  backdrop-filter: blur(8px);
  padding: 8px 16px; border-radius: 30px;
  font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.25);
}
.music-player-float .cover-section { display: flex; justify-content: center; margin: 8px 0 14px; }
.music-player-float .cover-art {
  width: 180px; height: 180px; border-radius: 30px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 22px 38px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.35);
  object-fit: cover; transition: transform 0.25s;
  cursor: pointer; pointer-events: auto;
}
.music-player-float .cover-art:active { transform: scale(0.96); }
.music-player-float .song-info { text-align: center; margin: 8px 0 6px; }
.music-player-float .song-title {
  font-size: 1.6rem; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px;
}
.music-player-float .artist { font-size: 0.95rem; opacity: 0.8; margin-top: 4px; }
.music-player-float .lyrics-container {
  background: rgba(0, 0, 0, 0.25);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-radius: 28px; padding: 14px 14px;
  margin: 10px 0 8px; border: 1px solid rgba(255,255,255,0.3);
  min-height: 70px; max-height: 100px;
  display: flex; align-items: center; justify-content: center;
  text-align: center; overflow-y: auto;
}
.music-player-float .lyrics-text {
  font-size: 1rem; font-weight: 500; line-height: 1.5; opacity: 0.9;
}
.music-player-float .progress-area {
  display: flex; align-items: center; gap: 10px; margin: 6px 0 8px;
}
.music-player-float .time-elapsed, .music-player-float .time-total {
  font-size: 0.75rem; width: 36px; opacity: 0.85;
}
.music-player-float .progress-bar {
  flex: 1; height: 5px;
  background: rgba(255,255,255,0.22);
  border-radius: 10px; overflow: hidden; cursor: pointer;
}
.music-player-float .progress-fill {
  width: 0%; height: 100%;
  background: white; border-radius: 10px;
  box-shadow: 0 0 10px white; transition: width 0.08s linear;
}
.music-player-float .controls {
  display: flex; align-items: center; justify-content: space-evenly;
  margin: 4px 0 10px;
}
.music-player-float .ctrl-btn {
  background: transparent; border: none; color: white;
  font-size: 28px; width: 50px; height: 50px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; opacity: 0.85; transition: all 0.2s;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
  -webkit-tap-highlight-color: transparent; border-radius: 50%;
  pointer-events: auto;
}
.music-player-float .ctrl-btn:active { opacity: 0.5; transform: scale(0.9); }
.music-player-float .play-btn { font-size: 44px; width: 68px; height: 68px; opacity: 0.95; }
.music-player-float .small-btn { font-size: 26px; }
.music-player-float .playlist-toggle { display: flex; justify-content: center; margin: 6px 0 2px; }
.music-player-float .list-btn {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 30px; padding: 8px 24px;
  color: white; font-weight: 500; font-size: 0.9rem;
  cursor: pointer; display: flex; align-items: center; gap: 6px;
  transition: 0.2s; letter-spacing: 0.5px; pointer-events: auto;
}
.music-player-float .list-btn:active { background: rgba(255,255,255,0.25); }

/* 歌单面板 */
.music-player-float .playlist-panel {
  position: absolute; bottom: 0; left: 0; width: 100%;
  background: rgba(20, 20, 30, 0.75);
  backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px);
  border-top: 1px solid rgba(255,255,255,0.4);
  border-radius: 30px 30px 0 0;
  padding: 20px 16px 24px; z-index: 10;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.23, 1, 0.32, 1);
  max-height: 55%; overflow-y: auto; color: white;
  box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
}
.music-player-float .playlist-panel.open { transform: translateY(0); }
.music-player-float .playlist-header {
  display: flex; justify-content: space-between;
  font-weight: 600; margin-bottom: 14px; font-size: 1.1rem;
}
.music-player-float .close-list {
  background: none; border: none; color: white;
  font-size: 24px; cursor: pointer; opacity: 0.8;
}
.music-player-float .song-item {
  padding: 14px 12px; border-bottom: 1px solid rgba(255,255,255,0.15);
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; border-radius: 14px; transition: background 0.2s;
}
.music-player-float .song-item.active { background: rgba(255,255,255,0.2); font-weight: 600; }
.music-player-float .song-item:active { background: rgba(255,255,255,0.15); }
.music-player-float .song-item-title { font-weight: 500; }
.music-player-float .song-item-artist { font-size: 0.8rem; opacity: 0.7; }

/* 关闭按钮 */


/* ============ 灯箱 ============ */
.lightbox-overlay {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.95);
  touch-action: none; backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 10000; display: none; justify-content: center; align-items: center;
  opacity: 0; transition: opacity 0.3s ease; overflow: hidden;
}
.lightbox-overlay.active { display: flex; opacity: 1; }
.lightbox-overlay img, .lightbox-overlay video {
  max-width: 90vw; max-height: 90vh; border-radius: 8px;
  box-shadow: 0 0 40px rgba(255,255,255,0.2);
  transform: scale(0.85);
  transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.lightbox-overlay.active img { transform: scale(1); }
.lightbox-overlay video {
  max-width: 90vw; max-height: 90vh; border-radius: 8px;
  box-shadow: 0 0 40px rgba(255,255,255,0.2);
  transform: scale(0.85);
  transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.lightbox-overlay.active video { transform: scale(1); }

/* 星空canvas层级 */
#starfield-layer-front { z-index: -2; }
#starfield-layer-mid { z-index: -3; }
#starfield-layer-back { z-index: -4; }
#particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9998; pointer-events: none; }
#shooting-stars-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

.g-col img { transition: transform 0.1s ease-out, filter 0.3s ease, box-shadow 0.3s ease; transform-style: preserve-3d; will-change: transform; }
.g-col.focus-mode .g-card:not(:hover) { filter: brightness(0.4) blur(3px); transform: scale(0.95); }
.g-col .g-card { transition: filter 0.3s ease, transform 0.3s ease; }

.spectrum-container { display: flex; align-items: flex-end; height: 20px; gap: 1px; margin-left: 8px; }
.spectrum-bar { width: 2px; background: white; border-radius: 1px; transition: height 0.05s ease; min-height: 2px; }
.magnetic-btn { transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
.typewriter-cursor { display: inline-block; width: 2px; height: 1em; background: white; margin-left: 2px; animation: blink 0.7s infinite; vertical-align: text-bottom; }
@keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

body.fullscreen-exit .sidebar-trigger,
body.fullscreen-exit .content { opacity: 0; pointer-events: none; }
body.fullscreen-exit .gallery-overlay,
body.fullscreen-exit .video-overlay { z-index: 9999; }

.lightbox-overlay.zoomed { overflow: visible; }
.lightbox-overlay img, .lightbox-overlay video {
  -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.lightbox-overlay.zoomed img, .lightbox-overlay.zoomed video {
  transition: transform 0.3s ease !important; cursor: zoom-out;
}
.lightbox-overlay img:not([style*="transform"]),
.lightbox-overlay video:not([style*="transform"]) { cursor: zoom-in; }

.lightbox-zoom-btn {
  position: absolute;

<script>
// ============ 全局状态 ============
var isVideoPlaying = false;
var musicPlayerFloat = document.getElementById('music-player-float');
var galleryOverlay = document.getElementById('gallery-overlay');
var videoOverlay = document.getElementById('video-overlay');
var rotatingNav = document.getElementById('rotating-nav');

// ============ Rotating Cards 点击事件 ============
(function() {
  function hideRotatingNav() {
    rotatingNav.style.opacity = '0';
    rotatingNav.style.pointerEvents = 'none';
  }
  function showRotatingNav() {
    var anyOpen = galleryOverlay.classList.contains('active')
               || videoOverlay.classList.contains('active')
               || musicPlayerFloat.classList.contains('active');
    if (!anyOpen) {
      rotatingNav.style.opacity = '1';
      rotatingNav.style.pointerEvents = 'auto';
    }
  }

  document.querySelectorAll('.rotating-nav .card').forEach(function(card) {
    card.addEventListener('click', function(e) {
      e.stopPropagation();
      var action = this.getAttribute('data-action');
      // 先关闭所有 overlay
      galleryOverlay.classList.remove('active');
      videoOverlay.classList.remove('active');
      musicPlayerFloat.classList.remove('active');

      switch(action) {
        case 'gallery':
          galleryOverlay.classList.add('active');
          hideRotatingNav();
          break;
        case 'video':
          videoOverlay.classList.add('active');
          hideRotatingNav();
          // 视频打开时暂停音乐
          pauseMusicForVideo();
          break;
        case 'music':
          musicPlayerFloat.classList.add('active');
          hideRotatingNav();
          // 打开音乐播放器时如果视频没在播放则恢复音乐
          resumeMusicIfNeeded();
          break;
        case 'test':
          window.location.href = 'test.html';
          break;
        case 'design':
          window.location.href = 'design.html';
          break;
        case 'code':
          window.location.href = 'code.html';
          break;
      }
    });
  });

  // 关闭按钮已删除，使用点击背景关闭

  // 点击背景关闭
  galleryOverlay.addEventListener('click', function(e) {
    if (e.target === galleryOverlay) {
      galleryOverlay.classList.remove('active');
      showRotatingNav();
    }
  });
  videoOverlay.addEventListener('click', function(e) {
    if (e.target === videoOverlay) {
      videoOverlay.classList.remove('active');
      showRotatingNav();
    }
  });

  // 音乐播放器点击空白处收起（但音乐不停）
  var playerWrapper = document.querySelector('.music-player-float .player-wrapper');
  musicPlayerFloat.addEventListener('click', function(e) {
    if (e.target === musicPlayerFloat) {
      musicPlayerFloat.classList.remove('active');
      showRotatingNav();
      // 音乐不停，继续播放
    }
  });

  // 点击遮罩层关闭音乐播放器
  var musicBackdrop = document.getElementById('music-player-backdrop');
  if (musicBackdrop) {
    musicBackdrop.addEventListener('click', function(e) {
      musicPlayerFloat.classList.remove('active');
      showRotatingNav();
      // 音乐不停，继续播放
    });
  }
})();

// ============ 音乐播放器逻辑（来自 yy2.html） ============
(function() {
  const playlist = [
    { title: "且听风吟", artist: "", src: "https://music.163.com/song/media/outer/url?id=3405074868.mp3", cover: "https://picsum.photos/id/106/300/300", lyrics: "清晨第一缕阳光 · 透过玻璃窗 · 温暖洒在脸上" },
    { title: "故风吟游之地", artist: "", src: "https://music.163.com/song/media/outer/url?id=2667716744.mp3", cover: "https://picsum.photos/id/106/300/300", lyrics: "一杯咖啡的时光 · 慵懒的午后 · 思绪飘向远方" },
    { title: "独角", artist: "", src: "独角.mp3", cover: "https://picsum.photos/id/1025/300/300", lyrics: "漫步在星河之间 · 微光闪烁的夜晚 · 你的眼眸像星辰" },
    { title: "星炬不熄", artist: "", src: "星炬不熄.mp3", cover: "https://picsum.photos/id/1043/300/300", lyrics: "雨滴落在树叶上 · 空气里弥漫清香 · 脚步轻轻走过" },
    { title: "远航星的告别", artist: "", src: "远航星的告别.mp3", cover: "https://picsum.photos/id/1047/300/300", lyrics: "霓虹灯闪烁的街 · 夜色温柔如水 · 人群川流不息" },
    { title: "肘我", artist: "", src: "https://music.163.com/song/media/outer/url?id=3379043419.mp3", cover: "https://picsum.photos/id/1049/300/300", lyrics: "海浪拍打岸边 · 海风轻拂脸庞 · 忘掉所有烦恼" },
    { title: "秋日私语", artist: "Autumn Leaf", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3", cover: "https://picsum.photos/id/1051/300/300", lyrics: "落叶铺满小径 · 秋天悄悄来临 · 思念随风飘散" },
    { title: "冬日暖阳", artist: "Winter Sun", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3", cover: "https://picsum.photos/id/1055/300/300", lyrics: "冬日的阳光 · 温暖而珍贵 · 像你的拥抱" },
    { title: "樱花雨", artist: "Sakura", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3", cover: "https://picsum.photos/id/1059/300/300", lyrics: "樱花飘落的速度 · 是每秒五厘米 · 美好稍纵即逝" },
    { title: "月光曲", artist: "Moonlight", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3", cover: "https://picsum.photos/id/1067/300/300", lyrics: "月光洒满大地 · 宁静而安详 · 晚安我的世界" }
  ];

  let currentIndex = 0;
  const audio = new Audio();
  let isPlaying = false;

  const bgImage = document.getElementById('bgImage');
  const coverImage = document.getElementById('coverImage');
  const songTitle = document.getElementById('songTitle');
  const artistName = document.getElementById('artistName');
  const lyricsDisplay = document.getElementById('lyricsDisplay');
  const currentTimeDisplay = document.getElementById('currentTimeDisplay');
  const durationDisplay = document.getElementById('durationDisplay');
  const progressFill = document.getElementById('progressFill');
  const progressBar = document.getElementById('progressBarContainer');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const liveTime = document.getElementById('liveTime');
  const liveDate = document.getElementById('liveDate');
  const togglePlaylistBtn = document.getElementById('togglePlaylistBtn');
  const playlistPanel = document.getElementById('playlistPanel');
  const closePlaylistBtn = document.getElementById('closePlaylistBtn');
  const songListContainer = document.getElementById('songListContainer');

  window.musicAudio = audio; // 暴露给外部控制
  window.isMusicPlaying = function() { return isPlaying; };

  function formatTime(sec) {
    if (isNaN(sec) || sec < 0) return "0:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + s.toString().padStart(2, '0');
  }

  function updateClock() {
    const now = new Date();
    liveTime.textContent = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    const days = ['周日','周一','周二','周三','周四','周五','周六'];
    liveDate.textContent = now.getFullYear() + '.' + (now.getMonth()+1).toString().padStart(2, '0') + '.' + now.getDate().toString().padStart(2, '0') + ' ' + days[now.getDay()];
  }

  function renderPlaylist() {
    songListContainer.innerHTML = playlist.map(function(song, idx) {
      const activeClass = idx === currentIndex ? 'active' : '';
      return '<div class="song-item ' + activeClass + '" data-index="' + idx + '">' +
        '<div><div class="song-item-title">' + song.title + '</div>' +
        '<div class="song-item-artist">' + song.artist + '</div></div>' +
        '<span>' + (idx === currentIndex ? '🎵' : '') + '</span></div>';
    }).join('');
    document.querySelectorAll('.song-item').forEach(function(item) {
      item.addEventListener('click', function() {
        const index = parseInt(item.dataset.index, 10);
        if (!isNaN(index) && index !== currentIndex) {
          loadTrack(index);
        }
        closePlaylist();
      });
    });
  }

  function loadTrack(index) {
    if (index < 0) index = playlist.length - 1;
    if (index >= playlist.length) index = 0;
    currentIndex = index;
    const track = playlist[currentIndex];
    songTitle.textContent = track.title;
    artistName.textContent = track.artist;
    coverImage.src = track.cover;
    lyricsDisplay.textContent = track.lyrics || "🎶";
    audio.src = track.src;
    audio.load();
    progressFill.style.width = '0%';
    currentTimeDisplay.textContent = '0:00';
    durationDisplay.textContent = '0:00';
    renderPlaylist();
    if (isPlaying) {
      audio.play().catch(function() { isPlaying = false; updatePlayIcon(); });
    }
  }

  function updatePlayIcon() {
    playPauseBtn.textContent = isPlaying ? '⏸️' : '▶️';
  }

  function togglePlay() {
    if (!audio.src || audio.src === window.location.href) loadTrack(currentIndex);
    if (isPlaying) {
      audio.pause();
      isPlaying = false;
    } else {
      audio.play().then(function() { isPlaying = true; }).catch(function() { isPlaying = false; });
    }
    updatePlayIcon();
  }

  function pauseMusicForVideo() {
    if (isPlaying) {
      audio.pause();
      isPlaying = false;
      updatePlayIcon();
    }
  }

  function resumeMusicIfNeeded() {
    // 如果视频栏已关闭且音乐播放器也关闭了，且音乐没有在被观看视频时暂停
    // 这里不做自动恢复，让用户自己点播放
    // 但如果只是打开了音乐播放器，且之前没有在看视频，则恢复
  }

  function nextTrack() { loadTrack(currentIndex + 1); }
  function prevTrack() { loadTrack(currentIndex - 1); }

  function updateProgress() {
    if (audio.duration && !isNaN(audio.duration)) {
      progressFill.style.width = (audio.currentTime / audio.duration) * 100 + '%';
      currentTimeDisplay.textContent = formatTime(audio.currentTime);
      durationDisplay.textContent = formatTime(audio.duration);
    }
  }

  function setProgress(e) {
    if (!audio.duration) return;
    const rect = progressBar.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    audio.currentTime = ratio * audio.duration;
  }

  function openPlaylist() { playlistPanel.classList.add('open'); }
  function closePlaylist() { playlistPanel.classList.remove('open'); }

  audio.addEventListener('timeupdate', updateProgress);
  audio.addEventListener('loadedmetadata', function() {
    durationDisplay.textContent = formatTime(audio.duration);
    updateProgress();
  });
  audio.addEventListener('ended', function() {
    nextTrack();
    // 歌曲自然结束后，确保下一首自动播放
    setTimeout(function() {
        audio.play().catch(function(){});
    }, 50);
});
  audio.addEventListener('play', function() { isPlaying = true; updatePlayIcon(); });
  audio.addEventListener('pause', function() { isPlaying = false; updatePlayIcon(); });
  audio.addEventListener('error', function() {
    lyricsDisplay.textContent = "⚠️ 音频加载失败";
    isPlaying = false;
    updatePlayIcon();
  });

  playPauseBtn.addEventListener('click', togglePlay);
  prevBtn.addEventListener('click', prevTrack);
  nextBtn.addEventListener('click', nextTrack);
  progressBar.addEventListener('click', setProgress);
  coverImage.addEventListener('click', togglePlay);
  togglePlaylistBtn.addEventListener('click', openPlaylist);
  closePlaylistBtn.addEventListener('click', closePlaylist);
  playlistPanel.addEventListener('click', function(e) {
    if (e.target === playlistPanel) closePlaylist();
  });

  updateClock();
  setInterval(updateClock, 1000);
  loadTrack(0);
  audio.pause();
  isPlaying = false;
  updatePlayIcon();

// ============ 灯箱逻辑 ============
(function() {
  var lightboxOverlay = document.getElementById('lightbox-overlay');
  var lightboxImg = document.getElementById('lightbox-img');
  var lightboxVideo = document.getElementById('lightbox-video');
  var mediaElements = [];

  function collectMedia() {
    mediaElements = [];
    document.querySelectorAll('.g-col img').forEach(function(el) { mediaElements.push(el); });
  }
  collectMedia();

  var musicWasPlaying = false;
  function openLightboxMedia(src, type, idx) {
    // 如果是视频，暂停音乐并记住状态
    if (type === 'video' && window.musicAudio) {
      musicWasPlaying = window.isMusicPlaying();
      if (musicWasPlaying) {
        window.musicAudio.pause();
      }
    }
    // 暂停所有内联视频
    if (type === 'video') {
      document.querySelectorAll('.video-overlay video').forEach(function(v) {
        v.pause();
      });
    }
    lightboxImg.style.display = 'none';
    lightboxVideo.style.display = 'none';
    lightboxVideo.pause();
    lightboxVideo.src = '';
    if (type === 'video') {
      // 设置预加载并等待视频准备好后再播放
      lightboxVideo.preload = 'auto';
      lightboxVideo.src = src;
      lightboxVideo.style.display = 'block';
      
      // 显示放大按钮
      var zBtn = document.getElementById('lightbox-zoom-btn');
      if (zBtn) zBtn.classList.add('visible');
      
      // 等待视频加载完成后再调用 play()
      var playWhenReady = function() {
        if (lightboxVideo.readyState >= 2) { // HAVE_CURRENT_DATA 或更多
          lightboxVideo.play().catch(function(e) {
            console.warn('视频播放失败:', e);
          });
        } else {
          lightboxVideo.addEventListener('canplay', function onCanPlay() {
            lightboxVideo.removeEventListener('canplay', onCanPlay);
            lightboxVideo.play().catch(function(e) {
              console.warn('视频播放失败:', e);
            });
          }, { once: true });
        }
      };
      playWhenReady();
      
      // 超时保护：如果3秒后视频仍未准备好，也尝试播放
      setTimeout(function() {
        if (lightboxVideo.readyState < 2) {
          lightboxVideo.play().catch(function(e) {
            console.warn('视频播放超时:', e);
          });
        }
      }, 3000);
    } else {
      lightboxImg.src = src;
      lightboxImg.style.display = 'block';
      // 隐藏放大按钮
      var zBtn = document.getElementById('lightbox-zoom-btn');
      if (zBtn) zBtn.classList.remove('visible');
    }
    lightboxOverlay.classList.add('active');
  }
  function closeLightbox() {
    // 如果之前是视频且音乐在播放，恢复音乐
    if (musicWasPlaying && window.musicAudio) {
      // 延迟一点恢复音乐，确保灯箱关闭动画先执行
      setTimeout(function() {
        window.musicAudio.play().catch(function(){});
      }, 100);
    }
    musicWasPlaying = false;
    lightboxOverlay.classList.remove('active');
    lightboxVideo.pause();
    lightboxVideo.src = '';
    // 隐藏放大按钮
    var zBtn = document.getElementById('lightbox-zoom-btn');
    if (zBtn) zBtn.classList.remove('visible');
    setTimeout(function() { lightboxImg.src = ''; }, 300);
    // 灯箱关闭后恢复视频栏中所有视频的自动播放
    document.querySelectorAll('.video-overlay video').forEach(function(v) {
      v.play().catch(function(){});
    });
  }

  // 视频点击打开灯箱
  document.querySelectorAll('.v-col video').forEach(function(vid) {
    vid.addEventListener('click', function(e) {
      e.stopPropagation();
      // 确保视频源有效
      if (this.src) {
        openLightboxMedia(this.src, 'video', 0);
      } else {
        console.warn('视频源无效，无法打开灯箱');
      }
    });
  });

  document.querySelectorAll('.g-col img').forEach(function(img) {
    img.addEventListener('click', function(e) {
      e.stopPropagation();
      collectMedia();
      var idx = mediaElements.indexOf(this);
      openLightboxMedia(this.src, 'image', idx);
    });
  });

  lightboxOverlay.addEventListener('click', function(e) {
    if (e.target === lightboxOverlay) closeLightbox();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && lightboxOverlay.classList.contains('active')) closeLightbox();
  });

  // 灯箱滑动 + 双击缩放
  lightboxImg.setAttribute('draggable', 'false');
  lightboxVideo.setAttribute('draggable', 'false');
  lightboxImg.addEventListener('dragstart', function(e) { e.preventDefault(); });
  lightboxVideo.addEventListener('dragstart', function(e) { e.preventDefault(); });
  lightboxOverlay.style.webkitUserSelect = 'none';
  lightboxOverlay.style.userSelect = 'none';

  function getCurrentMediaElement() {
    if (lightboxImg.style.display === 'block' && lightboxImg.src) return lightboxImg;
    if (lightboxVideo.style.display === 'block' && lightboxVideo.src) return lightboxVideo;
    return null;
  }
  var isZoomed = false, justSwiped = false, lastTapTime = 0, currentMediaIndex = 0;

  function resetZoom() {
    lightboxImg.style.transform = ''; lightboxImg.style.transformOrigin = '';
    lightboxVideo.style.transform = ''; lightboxVideo.style.transformOrigin = '';
    lightboxOverlay.classList.remove('zoomed'); isZoomed = false;
    var zBtn = document.getElementById('lightbox-zoom-btn');
    if (zBtn) {
      zBtn.classList.remove('visible');
      zBtn.textContent = '🔍';
    }
  }

  function onPointerDown(e) {
    if (e.type === 'mousedown' && e.button !== 0) return;
    var target = e.target;
    if (target !== lightboxImg && target !== lightboxVideo) return;
    if (e.type === 'mousedown') e.preventDefault();
    e.stopPropagation();
    var clientX, clientY;
    if (e.type === 'touchstart') { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
    else { clientX = e.clientX; clientY = e.clientY; }
    var startX = clientX, startY = clientY;
    var isDragging = true, hasSwiped = false, swipeDist = 0;
    var onMove = function(ev) {
      if (!isDragging) return;
      ev.preventDefault();
      var mx, my;
      if (ev.type === 'touchmove') { mx = ev.touches[0].clientX; my = ev.touches[0].clientY; }
      else { mx = ev.clientX; my = ev.clientY; }
      var dx = mx - startX, dy = my - startY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
        hasSwiped = true; swipeDist = dx;
        var currentEl = getCurrentMediaElement();
        if (currentEl) { currentEl.style.transition = 'none'; currentEl.style.transform = 'translateX(' + dx + 'px) scale(1)'; }
      }
    };
    var onUp = function(ev) {
      isDragging = false;
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
      document.removeEventListener('touchcancel', onUp);
      if (hasSwiped) {
        if (swipeDist > 30) { justSwiped = true; setTimeout(function(){ justSwiped = false; }, 150); prevMedia(); }
        else if (swipeDist < -30) { justSwiped = true; setTimeout(function(){ justSwiped = false; }, 150); nextMedia(); }
        else { var currentEl = getCurrentMediaElement(); if (currentEl) { currentEl.style.transition = 'transform 0.3s ease'; currentEl.style.transform = 'translateX(0) scale(1)'; } }
      } else {
        var now = Date.now(); var timeDiff = now - lastTapTime;
        if (timeDiff < 300) {
          var currentEl = getCurrentMediaElement();
          if (currentEl) {
            var rect = currentEl.getBoundingClientRect();
            var clickX, clickY;
            if (ev.type === 'touchend') { clickX = startX; clickY = startY; }
            else { clickX = ev.clientX; clickY = ev.clientY; }
            var xPercent = ((clickX - rect.left) / rect.width) * 100;
            var yPercent = ((clickY - rect.top) / rect.height) * 100;
            if (isZoomed) {
              currentEl.style.transform = 'scale(1)'; currentEl.style.transformOrigin = 'center center';
              lightboxOverlay.classList.remove('zoomed'); isZoomed = false;
            } else {
              currentEl.style.transformOrigin = xPercent + '% ' + yPercent + '%';
              currentEl.style.transform = 'scale(1.8)'; currentEl.style.transition = 'transform 0.3s ease';
              lightboxOverlay.classList.add('zoomed'); isZoomed = true;
            }
          }
          lastTapTime = 0;
        } else { lastTapTime = now; }
      }
    };
    if (e.type === 'touchstart') {
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('touchend', onUp);
      document.addEventListener('touchcancel', onUp);
    } else {
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    }
  }
  lightboxImg.addEventListener('mousedown', onPointerDown);
  lightboxImg.addEventListener('touchstart', onPointerDown, { passive: false });
  lightboxVideo.addEventListener('mousedown', onPointerDown);
  lightboxVideo.addEventListener('touchstart', onPointerDown, { passive: false });

  var origOpenLightbox = openLightboxMedia;
  openLightboxMedia = function(src, type, idx) { resetZoom(); origOpenLightbox(src, type, idx); };
  var origCloseLightbox = closeLightbox;
  closeLightbox = function() { resetZoom(); origCloseLightbox(); };

  function nextMedia() {
    if (!lightboxOverlay.classList.contains('active')) return;
    collectMedia();
    currentMediaIndex = (currentMediaIndex + 1) % mediaElements.length;
    var el = mediaElements[currentMediaIndex];
    if (el.tagName === 'IMG') openLightboxMedia(el.src, 'image', currentMediaIndex);
  }
  function prevMedia() {
    if (!lightboxOverlay.classList.contains('active')) return;
    collectMedia();
    currentMediaIndex = (currentMediaIndex - 1 + mediaElements.length) % mediaElements.length;
    var el = mediaElements[currentMediaIndex];
    if (el.tagName === 'IMG') openLightboxMedia(el.src, 'image', currentMediaIndex);
  }
  // 放大按钮
  var zoomBtn = document.getElementById('lightbox-zoom-btn');
  zoomBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    var currentMedia = getCurrentMediaElement();
    if (currentMedia) {
      if (isZoomed) {
        currentMedia.style.transform = 'scale(1)';
        currentMedia.style.transformOrigin = 'center center';
        lightboxOverlay.classList.remove('zoomed');
        isZoomed = false;
        zoomBtn.textContent = '🔍';
      } else {
        currentMedia.style.transformOrigin = 'center center';
        currentMedia.style.transform = 'scale(1.8)';
        lightboxOverlay.classList.add('zoomed');
        isZoomed = true;
        zoomBtn.textContent = '❌';
      }
    }
  });

  document.addEventListener('keydown', function(e) {
    if (!lightboxOverlay.classList.contains('active')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') prevMedia();
    else if (e.key === 'ArrowRight') nextMedia();
  });
})();

// ============ 三层星空 ============
(function() {
  var STAR_COLOR = '#fff';
  var targetMouseX = window.innerWidth / 2, targetMouseY = window.innerHeight / 2;
  var mouseX = targetMouseX, mouseY = targetMouseY;
  var layerConfigs = {
    front: { count: 80, size: 3, speed: 0.0375, minScale: 0.5, color: '#ffffff' },
    mid:   { count: 120, size: 2, speed: 0.025, minScale: 0.25, color: '#a8c0ff' },
    back:  { count: 200, size: 1.5, speed: 0.012, minScale: 0.12, color: '#b8c6ec' }
  };
  var layerCanvases = {
    front: document.getElementById('starfield-layer-front'),
    mid: document.getElementById('starfield-layer-mid'),
    back: document.getElementById('starfield-layer-back')
  };
  var layerCtxs = {};
  for (var key in layerCanvases) { layerCtxs[key] = layerCanvases[key].getContext('2d'); }
  var starLayers = { front: [], mid: [], back: [] };

  function initStarLayer(layerName) {
    var config = layerConfigs[layerName];
    var canvas = layerCanvases[layerName];
    var w = canvas.width = window.innerWidth;
    var h = canvas.height = window.innerHeight;
    starLayers[layerName] = [];
    for (var i = 0; i < config.count; i++) {
      starLayers[layerName].push({
        x: Math.random() * w, y: Math.random() * h,
        z: config.minScale + Math.random() * (1 - config.minScale),
        baseAlpha: 0.3 + Math.random() * 0.7,
        twinkleSpeed: 0.01 + Math.random() * 0.03,
        twinkleOffset: Math.random() * Math.PI * 2
      });
    }
  }

  function resizeStarLayers() {
    for (var key in layerCanvases) {
      var canvas = layerCanvases[key];
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    }
  }

  function updateStarLayer(layerName, time) {
    var config = layerConfigs[layerName];
    var canvas = layerCanvases[layerName];
    var ctx = layerCtxs[layerName];
    var stars = starLayers[layerName];
    mouseX += (targetMouseX - mouseX) * 0.05;
    mouseY += (targetMouseY - mouseY) * 0.05;
    var cx = window.innerWidth / 2, cy = window.innerHeight / 2;
    var dx = (mouseX - cx) * config.speed;
    var dy = (mouseY - cy) * config.speed;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(function(star) {
      star.x += dx * star.z; star.y += dy * star.z;
      if (star.x < -10) star.x = canvas.width + 10;
      if (star.x > canvas.width + 10) star.x = -10;
      if (star.y < -10) star.y = canvas.height + 10;
      if (star.y > canvas.height + 10) star.y = -10;
      var twinkle = Math.sin(time * star.twinkleSpeed + star.twinkleOffset) * 0.3 + 0.7;
      var alpha = star.baseAlpha * twinkle;
      ctx.beginPath(); ctx.arc(star.x, star.y, config.size * star.z, 0, Math.PI * 2);
      ctx.fillStyle = config.color; ctx.globalAlpha = alpha * 0.9; ctx.fill();
      ctx.beginPath(); ctx.arc(star.x, star.y, config.size * star.z * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = config.color; ctx.globalAlpha = alpha * 0.1; ctx.fill();
      ctx.globalAlpha = 1;
    });
  }

  function animateStarLayers(time) {
    updateStarLayer('front', time);
    updateStarLayer('mid', time);
    updateStarLayer('back', time);
    requestAnimationFrame(animateStarLayers);
  }

  document.addEventListener('mousemove', function(e) { targetMouseX = e.clientX; targetMouseY = e.clientY; });
  document.addEventListener('touchmove', function(e) {
    if (e.touches.length > 0) { targetMouseX = e.touches[0].clientX; targetMouseY = e.touches[0].clientY; }
  }, { passive: true });
  for (var key in layerCanvases) { initStarLayer(key); }
  window.addEventListener('resize', resizeStarLayers);
  animateStarLayers(0);
})();

// ============ 粒子拖尾 ============
(function() {
  var particleCanvas = document.getElementById('particle-canvas');
  var pCtx = particleCanvas.getContext('2d');
  var particles = [];
  var lastParticleTime = 0;
  function resizeParticleCanvas() { particleCanvas.width = window.innerWidth; particleCanvas.height = window.innerHeight; }
  resizeParticleCanvas();
  window.addEventListener('resize', resizeParticleCanvas);
  function createParticle(x, y) {
    var colors = ['#ffffff', '#a8c0ff', '#b8c6ec', '#ffd700', '#ff9a9e', '#c2e9fb'];
    var color = colors[Math.floor(Math.random() * colors.length)];
    var size = Math.random() * 3 + 1;
    var vx = (Math.random() - 0.5) * 2;
    var vy = (Math.random() - 0.5) * 2 - 1;
    var life = 1, decay = Math.random() * 0.02 + 0.01;
    var twinkleSpeed = Math.random() * 0.1 + 0.05;
    particles.push({ x: x, y: y, size: size, vx: vx, vy: vy, color: color, life: life, decay: decay, twinkleSpeed: twinkleSpeed, age: 0 });
  }
  function animateParticles() {
    pCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy -= 0.02; p.life -= p.decay; p.age++;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      var twinkle = Math.sin(p.age * p.twinkleSpeed) * 0.3 + 0.7;
      var alpha = p.life * twinkle;
      pCtx.beginPath(); pCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      pCtx.fillStyle = p.color; pCtx.globalAlpha = alpha * 0.8; pCtx.fill();
      pCtx.beginPath(); pCtx.arc(p.x, p.y, p.size * p.life * 2, 0, Math.PI * 2);
      pCtx.fillStyle = p.color; pCtx.globalAlpha = alpha * 0.15; pCtx.fill();
      pCtx.globalAlpha = 1;
    }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();
  document.addEventListener('mousemove', function(e) {
    var now = Date.now();
    if (now - lastParticleTime > 30) {
      lastParticleTime = now;
      for (var i = 0; i < 3; i++) { createParticle(e.clientX + (Math.random() - 0.5) * 10, e.clientY + (Math.random() - 0.5) * 10); }
    }
  });
  document.addEventListener('touchmove', function(e) {
    var now = Date.now();
    if (now - lastParticleTime > 50) {
      lastParticleTime = now;
      if (e.touches.length > 0) {
        for (var i = 0; i < 2; i++) { createParticle(e.touches[0].clientX + (Math.random() - 0.5) * 10, e.touches[0].clientY + (Math.random() - 0.5) * 10); }
      }
    }
  }, { passive: true });
})();

(function() {
  var shootingCanvas = document.getElementById('shooting-stars-canvas');
  var shootingCtx = shootingCanvas.getContext('2d');
  var shootingStars = [];
  function resizeShootingCanvas() { shootingCanvas.width = window.innerWidth; shootingCanvas.height = window.innerHeight; }
  resizeShootingCanvas();
  window.addEventListener('resize', resizeShootingCanvas);
  function createShootingStar() {
    shootingStars.push({
      x: Math.random() * shootingCanvas.width,
      y: Math.random() * shootingCanvas.height * 0.5,
      length: Math.random() * 80 + 40,
      speed: Math.random() * 8 + 6,
      angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3,
      opacity: 1, decay: Math.random() * 0.015 + 0.008,
      color: '255, 255, 255'
    });
  }
  function animateShootingStars() {
    shootingCtx.clearRect(0, 0, shootingCanvas.width, shootingCanvas.height);
    for (var i = 0; i < shootingStars.length; i++) {
      var s = shootingStars[i];
      s.x += Math.cos(s.angle) * s.speed; s.y += Math.sin(s.angle) * s.speed;
      s.opacity -= s.decay;
      if (s.opacity <= 0) { shootingStars.splice(i, 1); i--; continue; }
      var tailX = s.x - Math.cos(s.angle) * s.length;
      var tailY = s.y - Math.sin(s.angle) * s.length;
      var gradient = shootingCtx.createLinearGradient(tailX, tailY, s.x, s.y);
      gradient.addColorStop(0, 'rgba(' + s.color + ', 0)');
      gradient.addColorStop(1, 'rgba(' + s.color + ', ' + s.opacity + ')');
      shootingCtx.beginPath(); shootingCtx.moveTo(tailX, tailY); shootingCtx.lineTo(s.x, s.y);
      shootingCtx.strokeStyle = gradient; shootingCtx.lineWidth = 2; shootingCtx.lineCap = 'round'; shootingCtx.stroke();
      shootingCtx.beginPath(); shootingCtx.arc(s.x, s.y, 2, 0, Math.PI * 2);
      shootingCtx.fillStyle = 'rgba(255, 255, 255, ' + s.opacity + ')'; shootingCtx.fill();
    }
    requestAnimationFrame(animateShootingStars);
  }
  animateShootingStars();
  function scheduleShootingStar() {
    var delay = Math.random() * 4000 + 2000;
    setTimeout(function() { createShootingStar(); scheduleShootingStar(); }, delay);
  }
  scheduleShootingStar();
})();

// ============ 时间主题 ============
(function() {
  function applyTimeTheme() {
    var hour = new Date().getHours();
    var starColor;
    if (hour >= 6 && hour < 12) starColor = '#FFD700';
    else if (hour >= 12 && hour < 18) starColor = '#FF6B6B';
    else if (hour >= 18 && hour < 22) starColor = '#a8c0ff';
    else starColor = '#b8c6ec';
    localStorage.setItem('theme_applied', 'true');
  }
  applyTimeTheme();
  setInterval(applyTimeTheme, 60000);
})();
</script>
