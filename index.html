<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title></title>
    <style>
        * { padding: 0; margin: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
        
        body {
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(-225deg, #0c0c3d 0%, #1a1a5e 30%, #2d1b69 100%);
        }

        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        #splash-screen {
            position: fixed; inset: 0;
            background: linear-gradient(-45deg, #fbc2eb, #a6c1ee, #c2e9fb, #e0c3fc, #f6d365);
            background-size: 400% 400%;
            animation: rainbowFlow 3s ease infinite; 
            z-index: 9999; display: flex; justify-content: center; align-items: center;
            transition: opacity 0.8s ease-out;
        }
        #splash-screen h1 {
            font-size: 72px; font-weight: bold; margin: 0; padding: 0 20px; text-align: center; line-height: 1.2;
            background: linear-gradient(-45deg, #fff, #fbc2eb, #fff);
            background-size: 400% 400%; -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
            animation: rainbowFlow 3s ease infinite;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }
        #splash-hint {
            position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8); font-size: 14px; letter-spacing: 2px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        @keyframes rainbowFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .music-player {
            position: fixed; top: calc(20px + env(safe-area-inset-top)); right: 20px; z-index: 100;
            display: flex; align-items: center; padding: 10px 15px; border-radius: 30px;
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px) saturate(1.5); -webkit-backdrop-filter: blur(15px) saturate(1.5);
            border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); 
            transition: all 0.3s ease; cursor: pointer;
        }
        .music-player:active { transform: scale(0.95); }
        .play-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 0; margin-right: 12px; display: flex; align-items: center; }
        .song-info { display: flex; flex-direction: column; margin-right: 10px; }
        .song-title { font-size: 14px; font-weight: bold; color: white; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .music-bars { display: flex; align-items: flex-end; height: 15px; gap: 2px; }
        .bar { width: 3px; background: white; border-radius: 2px; animation: equalizer 1s ease-in-out infinite; }
        .bar:nth-child(1) { height: 60%; animation-delay: 0s; }
        .bar:nth-child(2) { height: 100%; animation-delay: 0.2s; }
        .bar:nth-child(3) { height: 40%; animation-delay: 0.4s; }
        .bar:nth-child(4) { height: 80%; animation-delay: 0.1s; }
        .music-player.paused .bar { animation-play-state: paused; height: 20% !important; transition: height 0.3s; }
        @keyframes equalizer { 0%, 100% { height: 20%; } 50% { height: 100%; } }

        .playlist-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 98; background: rgba(0, 0, 0, 0.3); opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .playlist-overlay.active { opacity: 1; pointer-events: auto; }
        .playlist {
            position: fixed; top: calc(75px + env(safe-area-inset-top)); right: 20px; z-index: 99; width: 220px; 
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5);
            border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.15); padding: 10px;
            display: flex; flex-direction: column; gap: 8px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            opacity: 0; transform: translateY(-20px) scale(0.95); pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-origin: top right;
        }
        .playlist.active { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
        .playlist-item { background: rgba(255, 255, 255, 0.1); border: none; border-radius: 8px; padding: 10px 12px; color: white; text-align: left; cursor: pointer; font-size: 13px; transition: background 0.2s; }
        .playlist-item:active { background: rgba(255, 255, 255, 0.3); } 
        .playlist-item.active { background: rgba(255, 255, 255, 0.5); font-weight: bold; }

        .content {
            position: relative; z-index: 1; color: white; text-align: center;
            width: 80%; max-width: 400px; padding: 100px 40px 50px; margin-right: 100px;
            background: rgba(20, 20, 20, 0.3); backdrop-filter: blur(15px) saturate(1.5); -webkit-backdrop-filter: blur(15px) saturate(1.5);
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            opacity: 0; transform: translateX(50px); pointer-events: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .content.active { opacity: 1; transform: translateX(0); pointer-events: auto; }
        .sidebar-trigger {
            position: fixed; top: 50%; right: 0; transform: translateY(-50%); z-index: 101;
            padding: 15px 10px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-radius: 12px 0 0 12px; border: 1px solid rgba(255, 255, 255, 0.2); border-right: none;
            color: white; cursor: pointer; writing-mode: vertical-rl; font-size: 14px; letter-spacing: 4px;
            box-shadow: -4px 0 15px rgba(0, 0, 0, 0.2); transition: all 0.3s ease; user-select: none;
        }
        .sidebar-trigger:hover { background: rgba(255, 255, 255, 0.35); padding-right: 15px; }

        .gallery-trigger {
            position: fixed; bottom: 0; left: 0; width: 100%; padding: 15px 0;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.2); color: white; text-align: center;
            font-size: 14px; letter-spacing: 4px; cursor: pointer; z-index: 102;
            transition: all 0.3s ease; user-select: none;
        }
        .gallery-trigger:hover { background: rgba(255, 255, 255, 0.2); }

        .gallery-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); z-index: 103;
            overflow-y: auto; display: flex; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .gallery-overlay.active { opacity: 1; pointer-events: auto; }
        .gallery-grid {
            display: flex; gap: 20px; width: 90%; max-width: 1600px; padding: 60px 0;
        }
        .g-col { flex: 1; display: flex; flex-direction: column; gap: 20px; will-change: transform; }
        .g-col img, .g-col video {
            width: 100%; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            object-fit: cover; aspect-ratio: 3/4; background-color: #333;
            transition: transform 0.4s ease, box-shadow 0.4s ease; cursor: pointer;
        }
        .g-col img:hover, .g-col video:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(255,255,255,0.2); z-index: 10; position: relative; }
        .g-col:nth-child(1) { margin-top: -100px; }
        .g-col:nth-child(2) { margin-top: 50px; }
        .g-col:nth-child(3) { margin-top: 0px; }
        .g-col:nth-child(4) { margin-top: 50px; }
        .g-col:nth-child(5) { margin-top: -100px; }

        /* 视频卡片样式（与原始文件一致） */
        .video-card { position: relative; }
        .video-card video { border: 2px solid rgba(255,255,255,0.3); }
        .play-icon-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 48px; color: white; opacity: 0.8; pointer-events: none;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* 手机端适配 */
        @media (max-width: 768px) {
            .music-player { top: calc(15px + env(safe-area-inset-top)); right: 15px; padding: 8px 12px; }
            .playlist { top: calc(70px + env(safe-area-inset-top)); right: 15px; width: 200px; }
            .song-title { font-size: 13px; max-width: 120px; }
            .content { width: 85%; max-width: none; margin-right: 0; padding: 110px 20px 40px; }
            h1 { font-size: 32px !important; } p { font-size: 15px; line-height: 1.6; }
            .sidebar-trigger { padding: 20px 12px; font-size: 15px; letter-spacing: 6px; border-radius: 16px 0 0 16px; }
            .gallery-grid { gap: 8px; padding: 40px 0; display: block; columns: 3; column-gap: 8px; }
             
            #splash-screen h1 { font-size: 48px; }
            /* 手机端：每列独立滚动 */
            .g-col { display: inline-block; width: 100%; break-inside: avoid; margin-top: 0 !important; }
            .g-col img, .g-col .video-card { break-inside: avoid; width: 100%; }
            .g-col::-webkit-scrollbar { display: none; }
        }
    
        .lightbox-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.95);
            touch-action: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10000;
            display: none; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.3s ease;
            overflow: hidden;
        }
        .lightbox-overlay.active {
            
            display: flex; opacity: 1;
        }
        .lightbox-overlay img,
        .lightbox-overlay video {
            --zoom-x: 50%;
            --zoom-y: 50%;

            max-width: 90vw; max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(255,255,255,0.2);
            transform: scale(0.85);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .lightbox-overlay.active img {
            transform: scale(1);
        }
        .lightbox-overlay video {
            max-width: 90vw; max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(255,255,255,0.2);
            transform: scale(0.85);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .lightbox-overlay.active video {
            transform: scale(1);
        }
        /* 灯箱图片/视频缩放样式 */
    
                /* --- 多層星空视差（三层星空） --- */
        #starfield-layer-front { z-index: -2; }
        #starfield-layer-mid { z-index: -3; }
        #starfield-layer-back { z-index: -4; }
        
        /* --- 鼠标粒子拖尾 --- */
        #particle-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9998; pointer-events: none;
        }

/* --- 流星划过特效 --- */
        #shooting-stars-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
        }

    
/* --- 3D卡片倾斜 --- */
        .g-col img, .g-col .video-card {
            transition: transform 0.1s ease-out, filter 0.3s ease, box-shadow 0.3s ease;
            transform-style: preserve-3d;
            will-change: transform;
        }
        
        /* --- 卡片聚焦模式 --- */
        .g-col.focus-mode .g-card:not(:hover) {
            filter: brightness(0.4) blur(3px);
            transform: scale(0.95);
        }
        .g-col .g-card {
            transition: filter 0.3s ease, transform 0.3s ease;
        }
        .g-col img, .g-col .video-card {
            position: relative;
        }
        
        /* --- 音频频谱条 --- */
        .spectrum-container {
            display: flex;
            align-items: flex-end;
            height: 20px;
            gap: 1px;
            margin-left: 8px;
        }
        .spectrum-bar {
            width: 2px;
            background: white;
            border-radius: 1px;
            transition: height 0.05s ease;
            min-height: 2px;
        }
        
        /* --- 磁吸按钮 --- */
        .magnetic-btn {
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        /* --- 打字机标题光标 --- */
        .typewriter-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: white;
            margin-left: 2px;
            animation: blink 0.7s infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
        
        /* --- 全屏沉浸模式 --- */
        body.fullscreen-exit .music-player,
        body.fullscreen-exit .playlist,
        body.fullscreen-exit .playlist-overlay,
        body.fullscreen-exit .sidebar-trigger,
        body.fullscreen-exit .gallery-trigger,
        body.fullscreen-exit .content {
            opacity: 0;
            pointer-events: none;
        }
        body.fullscreen-exit .gallery-overlay {
            z-index: 9999;
        }

    
        /* 灯箱缩放状态 */
        .lightbox-overlay.zoomed {
            overflow: visible;
        }
        .lightbox-overlay img,
        .lightbox-overlay video {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .lightbox-overlay.zoomed img,
        .lightbox-overlay.zoomed video {
            transition: transform 0.3s ease !important;
            cursor: zoom-out;
        }
        .lightbox-overlay img:not([style*="transform"]),
        .lightbox-overlay video:not([style*="transform"]) {
            cursor: zoom-in;
        }
</style>
</head>
<body>

    <canvas id="shooting-stars-canvas"></canvas>    <canvas id="spectrum-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-5;pointer-events:none;"></canvas>

    <div class="playlist-overlay" id="playlist-overlay"></div>

    <div class="music-player paused" id="music-player">

    <div class="lightbox-overlay" id="lightbox-overlay">
        <img id="lightbox-img" src="" alt="放大图片" style="display:none;" >

    </div>

    <audio id="bg-music" src="星炬不熄.mp3" preload="auto"></audio>

    <script>
        window.addEventListener('load', function() {
            var audio = document.getElementById("bg-music"),
                player = document.getElementById("music-player"),
                playBtn = document.getElementById("play-btn"),
                songTitle = document.getElementById("song-title"),
                playlist = document.getElementById("playlist"),
                overlay = document.getElementById("playlist-overlay"),
                playlistItems = document.querySelectorAll(".playlist-item"),
                sidebarTrigger = document.getElementById("sidebar-trigger"),
                content = document.getElementById("content"),
                splash = document.getElementById("splash-screen"),
                lightboxOverlay = document.getElementById("lightbox-overlay"),
                lightboxImg = document.getElementById("lightbox-img"),
                lightboxVideo = document.getElementById("lightbox-video");

            function playMusic() {
                audio.play().then(function() {
                    playBtn.innerHTML = "⏸";
                    player.classList.remove("paused");
                }).catch(function(e) { console.log("播放失败:", e); });
            }
            function pauseMusic() {
                audio.pause();
                playBtn.innerHTML = "▶";
                player.classList.add("paused");
            }

            playBtn.addEventListener("click", function(e) {
                e.stopPropagation();
                if (audio.paused) playMusic();
                else pauseMusic();
            });
            
            function togglePlaylist() {
                playlist.classList.toggle("active");
                overlay.classList.toggle("active");
            }
            player.addEventListener("click", function(e) {
                if (e.target === playBtn || playBtn.contains(e.target)) return;
                togglePlaylist();
            });

            playlistItems.forEach(function(item) {
                item.addEventListener("click", function() {
                    playlistItems.forEach(function(i) { i.classList.remove("active"); });
                    this.classList.add("active");
                    audio.src = this.getAttribute("data-src");
                    songTitle.innerText = this.getAttribute("data-name");
                    playMusic();
                });
            });
            audio.addEventListener('ended', function() {
                var currentIndex = -1;
                playlistItems.forEach(function(item, index) {
                    if (item.classList.contains('active')) currentIndex = index;
                });
                var nextIndex = (currentIndex + 1) % playlistItems.length;
                audio.currentTime = 0;
                playlistItems[nextIndex].click();
            });

            overlay.addEventListener("click", function() {
                playlist.classList.remove("active");
                content.classList.remove("active");
                overlay.classList.remove("active");
            });
            sidebarTrigger.addEventListener("click", function(e) {
                e.stopPropagation();
                content.classList.toggle("active");
                if (content.classList.contains("active")) {
                    playlist.classList.remove("active");
                    overlay.classList.remove("active");
                }
            });

            document.addEventListener("click", function(e) {
                if (!content.contains(e.target) && !sidebarTrigger.contains(e.target)) {
                    content.classList.remove("active");
                }
            });

            // --- 灯箱逻辑 ---
                function openLightboxMedia(src, type, idx) {
                lightboxImg.style.display = 'none';
                lightboxVideo.style.display = 'none';
                lightboxVideo.pause();
                lightboxVideo.src = '';

                if (typeof idx === 'number') {
                    currentMediaIndex = idx;
                }

                if (type === 'video') {
                    lightboxVideo.src = src;
                    lightboxVideo.style.display = 'block';
                    lightboxVideo.play();
                } else {
                    lightboxImg.src = src;
                    lightboxImg.style.display = 'block';
                }
                lightboxOverlay.classList.add('active');
            }

            

            

            function closeLightbox() {
                lightboxOverlay.classList.remove('active');
                lightboxVideo.pause();
                lightboxVideo.src = '';
                setTimeout(function() { lightboxImg.src = ''; }, 300);
            }

            // === 构建媒体元素数组（按DOM顺序：每列从上到下） ===
var mediaElements = [];
document.querySelectorAll('.g-col').forEach(function(col) {
    col.querySelectorAll('img, .video-card').forEach(function(el) {
        mediaElements.push(el);
    });
});
var currentMediaIndex = 0;

// 给所有画廊图片绑定点击事件

// === 状态管理 ===
var isZoomed = false;
var justSwiped = false;

// === 放大（以点击位置为中心） ===
function zoomIn(clickX, clickY) {
    var currentEl = getCurrentMediaElement();
    if (!currentEl) return;
    var rect = currentEl.getBoundingClientRect();
    var xPercent = ((clickX - rect.left) / rect.width) * 100;
    var yPercent = ((clickY - rect.top) / rect.height) * 100;
    currentEl.style.transformOrigin = xPercent + '% ' + yPercent + '%';
    currentEl.style.transform = 'scale(1.8)';
    currentEl.style.transition = 'transform 0.3s ease';
    lightboxOverlay.classList.add('zoomed');
    isZoomed = true;
}

// === 还原（回到原始大小） ===
function zoomOut() {
    var currentEl = getCurrentMediaElement();
    if (!currentEl) return;
    currentEl.style.transform = 'scale(1)';
    currentEl.style.transformOrigin = 'center center';
    lightboxOverlay.classList.remove('zoomed');
    isZoomed = false;
}

// === 重置缩放（切换图片/关闭灯箱时调用） ===
function resetZoom() {
    lightboxImg.style.transform = '';
    lightboxImg.style.transformOrigin = '';

}

// === 统一的鼠标/触摸事件处理 ===
var lastTapTime = 0;

function onPointerDown(e) {
    // 只处理主按钮（左键）
    if (e.type === 'mousedown' && e.button !== 0) return;
    
    var target = e.target;
    if (target !== lightboxImg && target !== lightboxVideo) return;
    
    // 仅在鼠标事件中阻止默认行为（防止文本选中/图片拖拽），touch事件在onMove中处理
    if (e.type === 'mousedown') {
        e.preventDefault();
    }
    e.stopPropagation();
    
    var clientX, clientY;
    if (e.type === 'touchstart') {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    } else {
        clientX = e.clientX;
        clientY = e.clientY;
    }
    
    var startX = clientX;
    var startY = clientY;
    var isDragging = true;
    var hasSwiped = false;
    var swipeDist = 0;
    
    // 绑定全局移动/释放事件
    var onMove = function(ev) {
        if (!isDragging) return;
        ev.preventDefault();
        
        var mx, my;
        if (ev.type === 'touchmove') {
            mx = ev.touches[0].clientX;
            my = ev.touches[0].clientY;
        } else {
            mx = ev.clientX;
            my = ev.clientY;
        }
        
        var dx = mx - startX;
        var dy = my - startY;
        
        // 水平移动明显大于垂直移动，且超过10px -> 判定为滑动
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
            hasSwiped = true;
            swipeDist = dx;
            var currentEl = getCurrentMediaElement();
            if (currentEl) {
                currentEl.style.transition = 'none';
                currentEl.style.transform = 'translateX(' + dx + 'px) scale(1)';
            }
        }
    };
    
    var onUp = function(ev) {
        // 确保标记为未拖拽状态
        isDragging = false;
        
        // 移除全局监听
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onUp);
        document.removeEventListener('touchcancel', onUp);
        
        if (hasSwiped) {
            // === 滑动切换 ===
            if (swipeDist > 30) {
                justSwiped = true;
                setTimeout(function(){ justSwiped = false; }, 150);
                prevMedia();
            } else if (swipeDist < -30) {
                justSwiped = true;
                setTimeout(function(){ justSwiped = false; }, 150);
                nextMedia();
            } else {
                // 回弹
                var currentEl = getCurrentMediaElement();
                if (currentEl) {
                    currentEl.style.transition = 'transform 0.3s ease';
                    currentEl.style.transform = 'translateX(0) scale(1)';
                }
            }
        } else {
            // === 点击或双击 ===
            var now = Date.now();
            var timeDiff = now - lastTapTime;
            
            if (timeDiff < 300) {
                // 双击 -> 放大/还原
                var currentEl = getCurrentMediaElement();
                if (currentEl) {
                    var rect = currentEl.getBoundingClientRect();
                    var clickX, clickY;
                    if (ev.type === 'touchend') {
                        clickX = startX;
                        clickY = startY;
                    } else {
                        clickX = ev.clientX;
                        clickY = ev.clientY;
                    }
                    var xPercent = ((clickX - rect.left) / rect.width) * 100;
                    var yPercent = ((clickY - rect.top) / rect.height) * 100;
                    
                    if (isZoomed) {
                        // 已放大 -> 还原
                        currentEl.style.transform = 'scale(1)';
                        currentEl.style.transformOrigin = 'center center';
                        lightboxOverlay.classList.remove('zoomed');
                        isZoomed = false;
                    } else {
                        // 未放大 -> 放大
                        currentEl.style.transformOrigin = xPercent + '% ' + yPercent + '%';
                        currentEl.style.transform = 'scale(1.8)';
                        currentEl.style.transition = 'transform 0.3s ease';
                        lightboxOverlay.classList.add('zoomed');
                        isZoomed = true;
                    }
                }
                lastTapTime = 0;
            } else {
                // 单击 -> 不关闭灯箱，等待双击
                lastTapTime = now;
            }
        }
    };
    
    // 绑定全局事件
    if (e.type === 'touchstart') {
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onUp);
        document.addEventListener('touchcancel', onUp);
    } else {
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
    }
}

                var tailX = s.x - Math.cos(s.angle) * s.length;
                var tailY = s.y - Math.sin(s.angle) * s.length;

                var gradient = shootingCtx.createLinearGradient(tailX, tailY, s.x, s.y);
                gradient.addColorStop(0, 'rgba(' + s.color + ', 0)');
                gradient.addColorStop(1, 'rgba(' + s.color + ', ' + s.opacity + ')');

                shootingCtx.beginPath();
                shootingCtx.moveTo(tailX, tailY);
                shootingCtx.lineTo(s.x, s.y);
                shootingCtx.strokeStyle = gradient;
                shootingCtx.lineWidth = 2;
                shootingCtx.lineCap = 'round';
                shootingCtx.stroke();

                // 头部亮点
                shootingCtx.beginPath();
                shootingCtx.arc(s.x, s.y, 2, 0, Math.PI * 2);
                shootingCtx.fillStyle = 'rgba(255, 255, 255, ' + s.opacity + ')';
                shootingCtx.fill();
            }

            requestAnimationFrame(animateShootingStars);
        }
        animateShootingStars();

        // 随机生成流星，每 2-6 秒一次
        function scheduleShootingStar() {
            var delay = Math.random() * 4000 + 2000;
            setTimeout(function() {
                createShootingStar();
                scheduleShootingStar();
            }, delay);
        }
        scheduleShootingStar();

    
        // --- 5. 3D卡片倾斜 ---
        document.querySelectorAll('.g-col').forEach(function(col) {
            col.addEventListener('mousemove', function(e) {
                var rect = col.getBoundingClientRect();
                var x = e.clientX - rect.left;
                var y = e.clientY - rect.top;
                var centerX = rect.width / 2;
                var centerY = rect.height / 2;
                var rotateX = (y - centerY) / centerY * -8;
                var rotateY = (x - centerX) / centerX * 8;
                
                col.querySelectorAll('img, .video-card').forEach(function(card) {
                    card.style.transform = 'perspective(1000px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) scale(1.02)';
                });
            });
            
            col.addEventListener('mouseleave', function() {
                col.querySelectorAll('img, .video-card').forEach(function(card) {
                    card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale(1)';
                });
            });
        });
        
        // --- 6. 卡片聚焦模式 ---
        document.querySelectorAll('.g-col').forEach(function(col) {
            col.addEventListener('mouseenter', function() {
                col.classList.add('focus-mode');
            });
            col.addEventListener('mouseleave', function() {
                col.classList.remove('focus-mode');
            });
        });
        
        // --- 7. 音频频谱跳动 ---
        var spectrumCanvas = document.getElementById('spectrum-canvas');
        var sCtx = spectrumCanvas.getContext('2d');
        var spectrumBars = document.getElementById('spectrum-container');
        var NUM_BARS = 20;
        var audioContext, analyser, dataArray;
        var isAudioSetup = false;
        
        // 创建频谱条DOM元素
        for (var i = 0; i < NUM_BARS; i++) {
            var bar = document.createElement('div');
            bar.className = 'spectrum-bar';
            bar.style.height = '2px';
            spectrumBars.appendChild(bar);
        }
        
        function setupAudioContext() {
            if (isAudioSetup) return;
            try {
                var audio = document.getElementById('bg-music');
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                var source = audioContext.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                analyser.fftSize = 64;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                isAudioSetup = true;
            } catch(e) {
                console.log('AudioContext not supported:', e);
            }
        }
        
        // 用户交互后初始化AudioContext
        document.addEventListener('click', function() {
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
            setupAudioContext();
        }, { once: false });
        
        function animateSpectrum() {
            requestAnimationFrame(animateSpectrum);
            if (!isAudioSetup || !analyser) return;
            
            analyser.getByteFrequencyData(dataArray);
            var bars = spectrumBars.querySelectorAll('.spectrum-bar');
            
            for (var i = 0; i < NUM_BARS; i++) {
                var value = dataArray[i] || 0;
                var height = Math.max(2, (value / 255) * 20);
                bars[i].style.height = height + 'px';
                // 颜色随高度变化
                var hue = 200 + (height / 20) * 60;
                bars[i].style.background = 'hsl(' + hue + ', 80%, 70%)';
            }
        }
        animateSpectrum();
        
        // --- 8. 磁吸按钮 ---
        document.querySelectorAll('.magnetic-btn').forEach(function(btn) {
            btn.addEventListener('mousemove', function(e) {
                var rect = btn.getBoundingClientRect();
                var x = e.clientX - rect.left - rect.width / 2;
                var y = e.clientY - rect.top - rect.height / 2;
                btn.style.transform = 'translate(' + (x * 0.3) + 'px, ' + (y * 0.3) + 'px)';
            });
            
            btn.addEventListener('mouseleave', function() {
                btn.style.transform = 'translate(0, 0)';
            });
        });
        
        // --- 9. 打字机标题 ---
        var typewriterText = "";
        var typewriterEl = document.getElementById('typewriter-title');
        var typewriterCursor = document.getElementById('typewriter-cursor');
        var charIndex = 0;
        var typewriterStarted = false;
        
        function typeWriter() {
            if (charIndex < typewriterText.length) {
                typewriterEl.innerHTML += typewriterText.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 150);
            } else {
                // 打字完成后光标闪烁一段时间后隐藏
                setTimeout(function() {
                    typewriterCursor.style.display = 'none';
                }, 2000);
            }
        }
        
        // 开屏动画结束后开始打字
        var origSplashRemove = setTimeout;
        // 在开屏消失后开始打字
        var splash = document.getElementById('splash-screen');
        if (splash) {
            var observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    if (mutation.type === 'attributes' && mutation.attributeName === 'style') {
                        if (splash.style.opacity === '0') {
                            setTimeout(function() {
                                typewriterStarted = true;
                                typeWriter();
                            }, 1000);
                            observer.disconnect();
                        }
                    }
                });
            });
            observer.observe(splash, { attributes: true });
        }
        
        // --- 10. 全屏沉浸模式 ---
        
        
        // 全屏变化时退出全屏模式
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('msfullscreenchange', handleFullscreenChange);
        
        function handleFullscreenChange() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                document.body.classList.remove('fullscreen-exit');
            }
        }
        
        // ESC键退出全屏时也移除UI
        });</script>
</body>
