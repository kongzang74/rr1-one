<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        .video-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; overflow: hidden;
        }
        .video-bg video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
        }
        .content {
            position: relative; z-index: 1; color: white;
            text-align: center; padding-top: 20vh; font-family: Arial, sans-serif;
        }
        /* 音乐控制按钮样式 */
        #music-btn {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            padding: 10px 20px; background: rgba(0,0,0,0.5); color: white;
            border: 1px solid white; border-radius: 20px; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 视频背景区域 -->
    <div class="video-bg">
        <video autoplay muted loop playsinline>
            <source src="n.mp4" type="video/mp4">
            你的浏览器不支持 HTML5 视频。
        </video>
    </div>

    <!-- 网页主体内容 -->
    <div class="content">
    </div>

    <!-- 音乐控制按钮与音频标签 (已移入 body 内) -->
    <button id="music-btn">🎵 播放音乐</button>
    <!-- 添加 id 方便 JS 控制，preload 预加载音乐 -->
    <audio id="bg-music" src="78.mp3" loop preload="auto"></audio>

    <script>
        // 获取音频和按钮元素
        var audio = document.getElementById("bg-music");
        var btn = document.getElementById("music-btn");

        // 尝试自动播放（部分旧版安卓或特定环境可能生效）
        window.addEventListener('load', function() {
            audio.play().then(() => {
                btn.innerHTML = "⏸ 暂停音乐";
            }).catch(() => {
                // 如果自动播放被拦截，保持按钮为“播放音乐”，等待用户点击
                console.log("自动播放被浏览器拦截，等待用户交互");
            });
        });

        // 绑定按钮点击事件，通过用户交互来播放/暂停
        btn.addEventListener("click", function() {
            if (audio.paused) {
                audio.play();
                btn.innerHTML = "⏸ 暂停音乐";
            } else {
                audio.pause();
                btn.innerHTML = "🎵 播放音乐";
            }
        });
    </script>

</body>
</html>
