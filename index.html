<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      background-image: url('a.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      background-color: #f0f0f0;
      min-height: 100vh;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      margin: 0;
    }

    /* --- 修改开始：光晕特效 --- */
    .halo {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: 100vh;
      z-index: 1; /* 确保光晕在背景之上，文字之下 */
      
      /* 使用径向渐变创建光晕的核心 */
      background: radial-gradient(
        circle at center, 
        rgba(255, 255, 255, 0.6) 0%,   /* 中心：亮白色 */
        rgba(255, 245, 220, 0.3) 40%,  /* 中间：带点暖色调 */
        rgba(255, 255, 255, 0) 75%     /* 边缘：完全透明 */
      );
      
      /* 混合模式：让光晕与背景图自然融合，产生“照亮”感 */
      mix-blend-mode: screen;
      
      /* 动画：让光晕产生呼吸效果 */
      animation: halo-breathe 4s ease-in-out infinite;
    }

    /* 使用伪元素增加一层模糊，让光晕更柔和、范围更大 */
    .halo::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(
        circle at center, 
        rgba(255, 255, 255, 0.4) 0%, 
        rgba(255, 255, 255, 0) 60%
      );
      filter: blur(40px); /* 大范围模糊 */
      z-index: -1; /* 放在主光晕后面 */
    }

    @keyframes halo-breathe {
      0%, 100% {
        opacity: 0.6;
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }
    }
    /* --- 修改结束 --- */

    h1 {
      z-index: 2; /* 确保文字在光晕之上 */
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- 光晕元素 -->
  <div class="halo"></div>

  <h1>你好</h1>
 
  
  <audio src="b.mp3" autoplay loop></audio>
</body>
</html>
