<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星空音乐与交错相册</title>
    <style>
        * { padding: 0; margin: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
        
        body {
            display: flex; justify-content: center; align-items: center;
            background-image: linear-gradient(-225deg, #231557 0%, #43107a 29%, #ff1361 100%);
        }

        /* 星空 Canvas 放在最底层 */
        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        /* --- 开屏动画样式 --- */
        #splash-screen {
            position: fixed; inset: 0;
            background: linear-gradient(-45deg, #fbc2eb, #a6c1ee, #c2e9fb, #e0c3fc, #f6d365);
            background-size: 400% 400%;
            animation: rainbowFlow 3s ease infinite; 
            z-index: 9999; display: flex; justify-content: center; align-items: center;
            transition: opacity 0.8s ease-out;
        }
        #splash-screen h1 {
            font-size: 72px; font-weight: bold; margin: 0; padding: 0 20px; text-align: center; line-height: 1.2;
            background: linear-gradient(-45deg, #fff, #fbc2eb, #fff);
            background-size: 400% 400%; -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
            animation: rainbowFlow 3s ease infinite;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }
        @keyframes rainbowFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* 右上角毛玻璃音乐播放器 */
        .music-player {
            position: fixed; top: calc(20px + env(safe-area-inset-top)); right: 20px; z-index: 100;
            display: flex; align-items: center; padding: 10px 15px; border-radius: 30px;
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px) saturate(1.5); -webkit-backdrop-filter: blur(15px) saturate(1.5);
            border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); 
            transition: all 0.3s ease; cursor: pointer;
        }
        .music-player:active { transform: scale(0.95); }
        .play-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 0; margin-right: 12px; display: flex; align-items: center; }
        .song-info { display: flex; flex-direction: column; margin-right: 10px; }
        .song-title { font-size: 14px; font-weight: bold; color: white; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .music-bars { display: flex; align-items: flex-end; height: 15px; gap: 2px; }
        .bar { width: 3px; background: white; border-radius: 2px; animation: equalizer 1s ease-in-out infinite; }
        .bar:nth-child(1) { height: 60%; animation-delay: 0s; }
        .bar:nth-child(2) { height: 100%; animation-delay: 0.2s; }
        .bar:nth-child(3) { height: 40%; animation-delay: 0.4s; }
        .bar:nth-child(4) { height: 80%; animation-delay: 0.1s; }
        .music-player.paused .bar { animation-play-state: paused; height: 20% !important; transition: height 0.3s; }
        @keyframes equalizer { 0%, 100% { height: 20%; } 50% { height: 100%; } }

        /* 歌曲列表 */
        .playlist-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 98; background: rgba(0, 0, 0, 0.3); opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .playlist-overlay.active { opacity: 1; pointer-events: auto; }
        .playlist {
            position: fixed; top: calc(75px + env(safe-area-inset-top)); right: 20px; z-index: 99; width: 220px; 
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5);
            border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.15); padding: 10px;
            display: flex; flex-direction: column; gap: 8px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            opacity: 0; transform: translateY(-20px) scale(0.95); pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-origin: top right;
        }
        .playlist.active { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
        .playlist-item { background: rgba(255, 255, 255, 0.1); border: none; border-radius: 8px; padding: 10px 12px; color: white; text-align: left; cursor: pointer; font-size: 13px; transition: background 0.2s; }
        .playlist-item:active { background: rgba(255, 255, 255, 0.3); } 
        .playlist-item.active { background: rgba(255, 255, 255, 0.5); font-weight: bold; }

        /* 右侧抽屉式文字区域 */
        .content {
            position: relative; z-index: 1; color: white; text-align: center;
            width: 80%; max-width: 400px; padding: 100px 40px 50px; margin-right: 100px;
            background: rgba(20, 20, 20, 0.3); backdrop-filter: blur(15px) saturate(1.5); -webkit-backdrop-filter: blur(15px) saturate(1.5);
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            opacity: 0; transform: translateX(50px); pointer-events: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .content.active { opacity: 1; transform: translateX(0); pointer-events: auto; }
        .sidebar-trigger {
            position: fixed; top: 50%; right: 0; transform: translateY(-50%); z-index: 101;
            padding: 15px 10px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-radius: 12px 0 0 12px; border: 1px solid rgba(255, 255, 255, 0.2); border-right: none;
            color: white; cursor: pointer; writing-mode: vertical-rl; font-size: 14px; letter-spacing: 4px;
            box-shadow: -4px 0 15px rgba(0, 0, 0, 0.2); transition: all 0.3s ease; user-select: none;
        }
        .sidebar-trigger:hover { background: rgba(255, 255, 255, 0.35); padding-right: 15px; }

        /* --- 底部画廊触发条 --- */
        .gallery-trigger {
            position: fixed; bottom: 0; left: 0; width: 100%; padding: 15px 0;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.2); color: white; text-align: center;
            font-size: 14px; letter-spacing: 4px; cursor: pointer; z-index: 102;
            transition: all 0.3s ease; user-select: none;
        }
        .gallery-trigger:hover { background: rgba(255, 255, 255, 0.2); }

        /* --- 全屏交错画廊 --- */
        .gallery-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); z-index: 103;
            overflow-y: auto; display: flex; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .gallery-overlay.active { opacity: 1; pointer-events: auto; }
        .gallery-grid {
            display: flex; gap: 20px; width: 90%; max-width: 1600px; padding: 60px 0;
        }
        .g-col { flex: 1; display: flex; flex-direction: column; gap: 20px; will-change: transform; }
        .g-col img {
            width: 100%; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            object-fit: cover; aspect-ratio: 3/4; background-color: #333;
            transition: transform 0.4s ease, box-shadow 0.4s ease; cursor: pointer;
        }
        .g-col img:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(255,255,255,0.2); z-index: 10; position: relative; }
        .g-col:nth-child(1) { margin-top: -100px; }
        .g-col:nth-child(2) { margin-top: 50px; }
        .g-col:nth-child(3) { margin-top: 0px; }
        .g-col:nth-child(4) { margin-top: 50px; }
        .g-col:nth-child(5) { margin-top: -100px; }

        /* 手机端适配 */
        @media (max-width: 768px) {
            .music-player { top: calc(15px + env(safe-area-inset-top)); right: 15px; padding: 8px 12px; }
            .playlist { top: calc(70px + env(safe-area-inset-top)); right: 15px; width: 200px; }
            .song-title { font-size: 13px; max-width: 120px; }
            .content { width: 85%; max-width: none; margin-right: 0; padding: 110px 20px 40px; }
            h1 { font-size: 32px !important; } p { font-size: 15px; line-height: 1.6; }
            .sidebar-trigger { padding: 20px 12px; font-size: 15px; letter-spacing: 6px; border-radius: 16px 0 0 16px; }
            .gallery-grid { gap: 10px; padding: 40px 0; }
            .g-col:nth-child(4), .g-col:nth-child(5) { display: none; } 
            #splash-screen h1 { font-size: 48px; }
        }
    </style>
</head>
<body>
    <!-- 开屏动画 -->
    <div id="splash-screen"><h1>嗨咯</h1></div>

    <canvas></canvas>
    <div class="playlist-overlay" id="playlist-overlay"></div>

    <!-- 音乐播放器 -->
    <div class="music-player paused" id="music-player">
        <button class="play-btn" id="play-btn">▶</button>
        <div class="song-info"><span class="song-title" id="song-title">默认背景音乐</span></div>
        <div class="music-bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
    </div>
    <div class="playlist" id="playlist">
        <button class="playlist-item active" data-src="星炬不熄.mp3" data-name="星炬不熄">🎵 星炬不熄</button>
        <button class="playlist-item" data-src="远航星的告别.mp3" data-name="远航星的告别">🎵 远航星的告别</button>
        <button class="playlist-item" data-src="独角.mp3" data-name="独角">🎵 独角</button>
    </div>

    <!-- 右侧抽屉 -->
    <div class="sidebar-trigger" id="sidebar-trigger">✨ 你好世界</div>
    <div class="content" id="content">
        <h1>你好，世界</h1>
        <p>人只有一次机会精彩活着，人只有一场生命尽情洒脱。</p>
    </div>

    <!-- 底部触发条与全屏画廊 -->
    <div class="gallery-trigger" id="gallery-trigger">✨</div>
    <div class="gallery-overlay" id="gallery-overlay">
        <div class="gallery-grid">
            <div class="g-col" id="g-col-1"><img src="./img/01.jpg" alt="Photo"><img src="./img/02.jpg" alt="Photo"><img src="./img/03.jpg" alt="Photo"><img src="./img/04.jpg" alt="Photo"></div>
            <div class="g-col" id="g-col-2"><img src="./img/05.jpg" alt="Photo"><img src="./img/06.jpg" alt="Photo"><img src="./img/07.jpg" alt="Photo"><img src="./img/08.jpg" alt="Photo"></div>
            <div class="g-col" id="g-col-3"><img src="./img/09.jpg" alt="Photo"><img src="./img/10.jpg" alt="Photo"><img src="./img/12.jpg" alt="Photo"><img src="./img/13.jpg" alt="Photo"></div>
            <div class="g-col" id="g-col-4"><img src="./img/14.jpg" alt="Photo"><img src="./img/15.jpg" alt="Photo"><img src="./img/16.jpg" alt="Photo"><img src="./img/17.jpg" alt="Photo"></div>
            <div class="g-col" id="g-col-5"><img src="./img/01.jpg" alt="Photo"><img src="./img/01.jpg" alt="Photo"><img src="./img/01.jpg" alt="Photo"><img src="./img/01.jpg" alt="Photo"></div>
        </div>
    </div>

    <audio id="bg-music" src="星炬不熄.mp3" preload="auto"></audio>

    <script>
        // --- 1. 页面交互逻辑 ---
        window.addEventListener('load', function() {
            var audio = document.getElementById("bg-music"), player = document.getElementById("music-player"),
                playBtn = document.getElementById("play-btn"), songTitle = document.getElementById("song-title"),
                playlist = document.getElementById("playlist"), overlay = document.getElementById("playlist-overlay"), 
                playlistItems = document.querySelectorAll(".playlist-item"),
                sidebarTrigger = document.getElementById("sidebar-trigger"), content = document.getElementById("content"),
                splash = document.getElementById("splash-screen");

            function playMusic() { audio.play().then(() => { playBtn.innerHTML = "⏸"; player.classList.remove("paused"); }).catch((e) => console.log("播放失败:", e)); }
            function pauseMusic() { audio.pause(); playBtn.innerHTML = "▶"; player.classList.add("paused"); }

            playBtn.addEventListener("click", function(e) { e.stopPropagation(); if (audio.paused) playMusic(); else pauseMusic(); });
            
            function togglePlaylist() { playlist.classList.toggle("active"); overlay.classList.toggle("active"); }
            player.addEventListener("click", function(e) { if (e.target === playBtn || playBtn.contains(e.target)) return; togglePlaylist(); });

            playlistItems.forEach(item => {
                item.addEventListener("click", function() {
                    playlistItems.forEach(i => i.classList.remove("active")); this.classList.add("active");
                    audio.src = this.getAttribute("data-src"); songTitle.innerText = this.getAttribute("data-name"); playMusic();
                });
            });
            audio.addEventListener('ended', function() {
                let currentIndex = -1;
                playlistItems.forEach((item, index) => { if (item.classList.contains('active')) currentIndex = index; });
                let nextIndex = (currentIndex + 1) % playlistItems.length;
                audio.currentTime = 0; playlistItems[nextIndex].click();
            });

            overlay.addEventListener("click", function() { playlist.classList.remove("active"); content.classList.remove("active"); overlay.classList.remove("active"); });
            sidebarTrigger.addEventListener("click", function(e) { e.stopPropagation(); content.classList.toggle("active"); if (content.classList.contains("active")) { playlist.classList.remove("active"); overlay.classList.remove("active"); } });
                        // 点击页面空白处收起侧边栏
            document.addEventListener("click", function(e) {
                // 如果点击的不是侧边栏触发按钮，且点击的也不是侧边栏内容区域
                if (!content.contains(e.target) && !sidebarTrigger.contains(e.target)) {
                    content.classList.remove("active");
                }
            });
                        // 【核心修复】：2.5秒后隐藏开屏动画，并彻底从DOM中移除它，防止挡住鼠标点击！
            setTimeout(() => { 
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => {
                        splash.remove(); // 彻底移除，不再阻挡页面交互
                    }, 800); // 等待 0.8s 的过渡动画结束
                }
                playMusic(); // 尝试自动播放音乐
            }, 2500);
        });

        // --- 2. 画廊交互与视差滚动逻辑 ---
        const galleryTrigger = document.getElementById('gallery-trigger');
        const galleryOverlay = document.getElementById('gallery-overlay');
        const gCol1 = document.getElementById('g-col-1');
        const gCol2 = document.getElementById('g-col-2');
        const gCol3 = document.getElementById('g-col-3');
        const gCol4 = document.getElementById('g-col-4');
        const gCol5 = document.getElementById('g-col-5');

        galleryTrigger.addEventListener('click', () => galleryOverlay.classList.add('active'));
        galleryOverlay.addEventListener('click', (e) => { if (e.target === galleryOverlay) galleryOverlay.classList.remove('active'); });

        galleryOverlay.addEventListener('scroll', () => {
            let scrollY = galleryOverlay.scrollTop;
            gCol1.style.transform = `translateY(${scrollY * -0.4}px)`;
            gCol5.style.transform = `translateY(${scrollY * -0.4}px)`;
            gCol2.style.transform = `translateY(${scrollY * 0.2}px)`;
            gCol4.style.transform = `translateY(${scrollY * 0.2}px)`;
            gCol3.style.transform = `translateY(${scrollY * 0.05}px)`;
        });

        // --- 3. 星空特效 JS ---
        const STAR_COLOR = '#fff', STAR_SIZE = 3, STAR_MIN_SCALE = 0.2, OVERFLOW_THRESHOLD = 50;
        const STAR_COUNT = (window.innerWidth + window.innerHeight) / 8;
        const canvas = document.querySelector('canvas'), context = canvas.getContext('2d');
        let scale = 1, width, height, stars = [], pointerX, pointerY;
        let velocity = { x: 0, y: 0, tx: 0, ty: 0, z: 0.0009 }, touchInput = false;
        
        generate(); resize(); step();
        window.onresize = resize;
        window.addEventListener('mousemove', onmousemove);
        window.addEventListener('touchmove', ontouchmove, { passive: false });
        window.addEventListener('touchend', onmouseleave);
        window.addEventListener('mouseleave', onmouseleave);

        function generate() { for (let i = 0; i < STAR_COUNT; i++) stars.push({ x: 0, y: 0, z: STAR_MIN_SCALE + Math.random() * (1 - STAR_MIN_SCALE) }); }
        function placestar(star) { star.x = Math.random() * width; star.y = Math.random() * height; }
        function recyclestar(star) {
            let direction = 'z', vx = Math.abs(velocity.x), vy = Math.abs(velocity.y);
            if (vx > 1 || vy > 1) {
                let axis = vx > vy ? (Math.random() < vx / (vx + vy) ? 'h' : 'v') : (Math.random() < vy / (vx + vy) ? 'v' : 'h');
                direction = axis === 'h' ? (velocity.x > 0 ? 'l' : 'r') : (velocity.y > 0 ? 't' : 'b');
            }
            star.z = STAR_MIN_SCALE + Math.random() * (1 - STAR_MIN_SCALE);
            if (direction === 'l') { star.z = 0.1; star.x = Math.random() * width; star.y = Math.random() * height; }
            else if (direction === 'r') { star.x = width + OVERFLOW_THRESHOLD; star.y = height * Math.random(); }
            else if (direction === 't') { star.x = width * Math.random(); star.y = -OVERFLOW_THRESHOLD; }
            else if (direction === 'b') { star.x = width * Math.random(); star.y = height + OVERFLOW_THRESHOLD; }
        }
        function resize() { scale = window.devicePixelRatio || 1; width = window.innerWidth * scale; height = window.innerHeight * scale; canvas.width = width; canvas.height = height; stars.forEach(placestar); }
        function step() { context.clearRect(0, 0, width, height); update(); render(); requestAnimationFrame(step); }
        function update() {
            velocity.tx *= 0.96; velocity.ty *= 0.96; velocity.x += (velocity.tx - velocity.x) * 0.8; velocity.y += (velocity.ty - velocity.y) * 0.8;
            stars.forEach((star) => {
                star.x += velocity.x * star.z; star.y += velocity.y * star.z;
                star.x += (star.x - width / 2) * velocity.z * star.z; star.y += (star.y - height / 2) * velocity.z * star.z;
                star.z += velocity.z;
                if (star.x < -OVERFLOW_THRESHOLD || star.x > width + OVERFLOW_THRESHOLD || star.y < -OVERFLOW_THRESHOLD || star.y > height + OVERFLOW_THRESHOLD) { recyclestar(star); }
            });
        }
        function render() {
            stars.forEach((star) => {
                context.beginPath(); context.lineCap = 'round'; context.lineWidth = STAR_SIZE * star.z * scale;
                context.globalAlpha = 0.5 + 0.5 * Math.random(); context.strokeStyle = STAR_COLOR;
                context.moveTo(star.x, star.y);
                let tailx = velocity.x * 2, tailY = velocity.y * 2;
                if (Math.abs(tailx) < 0.1) tailx = 0.5; if (Math.abs(tailY) < 0.1) tailY = 0.5;
                context.lineTo(star.x + tailx, star.y + tailY); context.stroke();
            });
        }
        function movepointer(x, y) {
            if (typeof pointerX === 'number' && typeof pointerY === 'number') {
                let ox = x - pointerX; let oy = y - pointerY;
                velocity.tx = velocity.tx + (ox / 8) * scale * (touchInput ? 1 : -1);
                velocity.ty = velocity.ty + (oy / 8) * scale * (touchInput ? 1 : -1);
            }
            pointerX = x; pointerY = y;
        }
        function onmousemove(event) { touchInput = false; movepointer(event.clientX, event.clientY); }
        function ontouchmove(event) { touchInput = true; movepointer(event.touches[0].clientX, event.touches[0].clientY); event.preventDefault(); }
        function onmouseleave() { pointerX = null; pointerY = null; }
    </script>
</body>
</html>
