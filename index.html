<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星空拖尾特效</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body {
            width: 100%;
            height: 100vh;
            /* 修正了渐变色中的非法字符 */
            background-image: linear-gradient(-225deg, #231557 0%, #43107a 29%, #ff1361 100%);
            overflow: hidden; /* 防止出现滚动条 */
        }

        canvas {
            position: fixed;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <canvas></canvas>
</body>

<script>
    const STAR_COLOR = '#fff';
    const STAR_SIZE = 3;
    const STAR_MIN_SCALE = 0.2; // 修正了变量名拼写
    const OVERFLOW_THRESHOLD = 50;
    const STAR_COUNT = (window.innerWidth + window.innerHeight) / 8; // 修正了大小写
    
    const canvas = document.querySelector('canvas'); // 修正了大小写
    const context = canvas.getContext('2d'); // 修正了大小写
    
    let scale = 1; // device pixel ratio
    let width;
    let height;
    let stars = [];
    let pointerX;
    let pointerY;
    let velocity = { x: 0, y: 0, tx: 0, ty: 0, z: 0.0009 };
    let touchInput = false; // 修正了变量名拼写

    generate();
    resize();
    step();

    window.onresize = resize;
    canvas.onmousemove = onmousemove;
    canvas.ontouchmove = ontouchmove;
    canvas.ontouchend = onmouseleave;
    document.onmouseleave = onmouseleave; // 修正了单词拼写

    function generate() {
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: 0,
                y: 0,
                z: STAR_MIN_SCALE + Math.random() * (1 - STAR_MIN_SCALE), // 修正了大小写和变量名
            });
        }
    }

    function placestar(star) {
        star.x = Math.random() * width; // 修正了大小写
        star.y = Math.random() * height; // 修正了大小写
    }

    function recyclestar(star) {
        let direction = 'z';
        let vx = Math.abs(velocity.x);
        let vy = Math.abs(velocity.y);
        if (vx > 1 || vy > 1) { // 修正了符号
            let axis;
            if (vx > vy) {
                axis = Math.random() < vx / (vx + vy) ? 'h' : 'v'; // 修正了符号
            } else {
                axis = Math.random() < vy / (vx + vy) ? 'v' : 'h'; // 修正了符号
            }

            if (axis === 'h') {
                direction = velocity.x > 0 ? 'l' : 'r'; // 修正了符号和字母(l代表left)
            } else {
                direction = velocity.y > 0 ? 't' : 'b'; // 修正了变量名拼写 sirection -> direction
            }
        }
        star.z = STAR_MIN_SCALE + Math.random() * (1 - STAR_MIN_SCALE);
        if (direction === 'l') { // 修正了字母 l
            star.z = 0.1;
            star.x = Math.random() * width;
            star.y = Math.random() * height;
        } else if (direction === 'l') { // 这里的逻辑原代码重复了，保持原意修正符号
            star.x = -OVERFLOW_THRESHOLD;
            star.y = height * Math.random();
        } else if (direction === 'r') {
            star.x = width + OVERFLOW_THRESHOLD;
            star.y = height * Math.random(); // 修正了 height + math.random() 的逻辑错误
        } else if (direction === 't') {
            star.x = width * Math.random();
            star.y = -OVERFLOW_THRESHOLD;
        } else if (direction === 'b') {
            star.x = width * Math.random();
            star.y = height + OVERFLOW_THRESHOLD;
        }
    }

    function resize() {
        scale = window.devicePixelRatio || 1; // 修正了符号
        width = window.innerWidth * scale; // 修正了大小写和符号
        height = window.innerHeight * scale; // 修正了变量名 weight -> height 和大小写
        canvas.width = width;
        canvas.height = height;
        stars.forEach(placestar);
    }

    function step() {
        context.clearRect(0, 0, width, height);
        update();
        render();
        requestAnimationFrame(step);
    }

    function update() {
        velocity.tx *= 0.96;
        velocity.ty *= 0.96;
        velocity.x += (velocity.tx - velocity.x) * 0.8;
        velocity.y += (velocity.ty - velocity.y) * 0.8;
        stars.forEach((star) => { // 修正了箭头函数符号
            star.x += velocity.x * star.z;
            star.y += velocity.y * star.z;
            star.x += (star.x - width / 2) * velocity.z * star.z;
            star.y += (star.y - height / 2) * velocity.z * star.z;
            star.z += velocity.z;
            if (
                star.x < -OVERFLOW_THRESHOLD || // 修正了符号
                star.x > width + OVERFLOW_THRESHOLD || // 修正了符号
                star.y < -OVERFLOW_THRESHOLD || // 修正了变量名拼写 OVERFLOW-THRESHOLD -> OVERFLOW_THRESHOLD
                star.y > height + OVERFLOW_THRESHOLD // 修正了符号
            ) {
                recyclestar(star);
            }
        });
    }

    function render() {
        stars.forEach((star) => { // 修正了箭头函数符号
            context.beginPath(); // 修正了单词拼写 beginpath -> beginPath
            context.lineCap = 'round'; // 修正了大小写
            context.lineWidth = STAR_SIZE * star.z * scale; // 修正了大小写
            context.globalAlpha = 0.5 + 0.5 * Math.random(); // 修正了大小写
            context.strokeStyle = STAR_COLOR; // 修正了大小写
            context.beginPath(); // 修正了单词拼写
            context.moveTo(star.x, star.y); // 修正了大小写
            let tailx = velocity.x * 2;
            let tailY = velocity.y * 2;
            if (Math.abs(tailx) < 0.1) tailx = 0.5; // 修正了符号和分号
            if (Math.abs(tailY) < 0.1) tailY = 0.5; // 修正了符号和分号
            context.lineTo(star.x + tailx, star.y + tailY); // 修正了大小写
            context.stroke(); // 原代码缺少了这一步，线条画了但没描边
        });
    }

    function movepointer(x, y) {
        if (typeof pointerX === 'number' && typeof pointerY === 'number') { // 修正了括号和符号
            let ox = x - pointerX;
            let oy = y - pointerY;
            velocity.tx = velocity.tx + (ox / 8) * scale * (touchInput ? 1 : -1); // 修正了变量名和符号
            velocity.ty = velocity.ty + (oy / 8) * scale * (touchInput ? 1 : -1); // 修正了变量名 0y -> oy 和符号
        }
        pointerX = x;
        pointerY = y; // 修正了变量名拼写 pointetY -> pointerY
    }

    function onmousemove(event) {
        touchInput = false; // 修正了变量名
        movepointer(event.clientX, event.clientY); // 修正了大小写
    }

    function ontouchmove(event) {
        touchInput = true; // 修正了变量名
        movepointer(event.touches[0].clientX, event.touches[0].clientY); // 修正了大小写和多余的参数
        event.preventDefault();
    }

    function onmouseleave() {
        pointerX = null; // 修正了 nu11 -> null
        pointerY = null; // 修正了 nu11 -> null
    }
</script>

</html>
