<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      background-image: url('a.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      background-color: #f0f0f0;
      min-height: 100vh;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      margin: 0;
      overflow: hidden; /* 防止光线溢出出现滚动条 */
    }

    /* --- 修改开始：光线特效 --- */
    .light-ray {
      position: fixed;
      top: -50%; /* 将中心点移出屏幕上方 */
      right: -10%; /* 稍微偏右 */
      width: 150vw; /* 宽度要非常大，覆盖整个对角线 */
      height: 150vh;
      z-index: 1; /* 保证在背景之上，文字之下（如果文字看不清可调高） */
      
      /* 使用圆锥渐变模拟光束 */
      background: conic-gradient(
        from 180deg at 50% 0%, 
        transparent 0deg, 
        rgba(255, 255, 255, 0) 60deg, 
        rgba(255, 255, 255, 0.4) 90deg, /* 光线核心：调整透明度让光更明显 */
        rgba(255, 255, 255, 0) 120deg, 
        transparent 180deg
      );
      
      /* 混合模式：让光线与背景图融合，产生“照亮”的感觉 */
      mix-blend-mode: screen; 
      
      /* 旋转动画 */
      animation: ray-rotate 10s linear infinite;
      
      /* 模糊滤镜：让光线边缘柔和 */
      filter: blur(20px);
    }

    /* 添加第二层光线，增加层次感 */
    .light-ray::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 50% 0%, rgba(255, 255, 200, 0.5), transparent 60%);
      filter: blur(10px);
    }

    @keyframes ray-rotate {
      from { transform: rotate(-45deg); }
      to { transform: rotate(315deg); }
    }
    /* --- 修改结束 --- */

    h1 {
      z-index: 2; /* 确保文字在光线上面 */
      text-shadow: 0 2px 10px rgba(0,0,0,0.5); /* 给文字加点阴影，防止光线太亮看不清 */
    }
  </style>
</head>
<body>

  <!-- 这是一个纯粹的光线元素，没有实体圆球 -->
  <div class="light-ray"></div>

  <h1>你好</h1>
  
   <audio id="myAudio" loop>
        <source src="78.mp3" type="audio/mpeg">
        您的浏览器不支持 audio 元素。
    </audio>
    <br>
    <!-- 通过按钮触发播放，符合浏览器策略 -->
    <button onclick="playAudio()">播放音乐</button>

    <script>
        function playAudio() {
            var audio = document.getElementById("myAudio");
            audio.play();
        }
    </script>
</body>
</html>
</html>
