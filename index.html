<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 基础样式，清除默认边距 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* 防止出现滚动条 */
        }

        /* 视频背景容器 */
        .video-bg {
            position: fixed; /* 固定在视窗，不随页面滚动 */
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1; /* 放在最底层 */
            overflow: hidden;
        }

        /* 视频元素样式 */
        .video-bg video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* 核心：保持比例铺满屏幕，自动裁剪多余部分 */
        }

        /* 你的网页内容 */
        .content {
            position: relative;
            z-index: 1;
            color: white;
            text-align: center;
            padding-top: 20vh;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <!-- 视频背景区域 -->
    <div class="video-bg">
        <!-- 
          autoplay: 自动播放 
          muted: 静音（现代浏览器强制要求静音才能自动播放）
          loop: 循环播放
          playsinline: 手机端禁止全屏弹出，作为内联背景播放
        -->
        <video autoplay muted loop playsinline>
            <!-- 将下面的 src 换成你自己的视频文件路径 -->
            <source src="t.mp4" type="video/mp4">
            你的浏览器不支持 HTML5 视频。
        </video>
    </div>

    <!-- 网页主体内容 -->
    <div class="content">
    </div>

<audio src="78.mp3" autoplay loop></audio>

</body>
</html>
